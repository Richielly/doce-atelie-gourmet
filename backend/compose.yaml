services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 12
  api:
    build: .
    restart: unless-stopped
    ports:
      - "7426:7426"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?defina BOOTSTRAP_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7426}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
