<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff3ed"><title>Doce Ateliê | Gourmet</title><style>
:root{--p:#a84e6e;--p2:#f5dbe3;--bg:#fff9f6;--surface:#fff;--ink:#342a30;--muted:#786e73;--line:#f0e4e7;--good:#25876d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:rgba(255,249,246,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:16px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:22px;color:var(--p);letter-spacing:-.7px}.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:1px}.headright{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;color:var(--ink)}.hero{border-radius:26px;background:linear-gradient(115deg,#9f4769,#c8788b);color:white;padding:25px;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden}.hero h1{font-size:29px;line-height:1.1;margin:6px 0}.hero p{margin:0;opacity:.9}.hero .art{font-size:75px;filter:drop-shadow(0 8px 8px #0002)}.tag{display:inline-block;background:#ffffff30;border:1px solid #ffffff55;border-radius:20px;padding:5px 10px;font-size:12px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h2{font-size:21px;margin:0}.muted{color:var(--muted)}.search{width:100%;padding:14px 16px;border:1px solid var(--line);background:white;border-radius:16px;outline-color:var(--p)}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip{border:1px solid var(--line);background:white;border-radius:25px;padding:10px 15px;white-space:nowrap}.chip.active,.primary{background:var(--p);color:white;border-color:var(--p)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:21px;overflow:hidden}.card .pic{height:135px;display:grid;place-items:center;background:linear-gradient(140deg,#fff0e7,#f5dce6);font-size:68px}.card .body{padding:14px}.card h3{font-size:16px;margin:0 0 6px}.card p{font-size:12px;min-height:31px;margin:0 0 10px;color:var(--muted)}.price{font-weight:800;color:var(--p);font-size:18px}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 14px;font-weight:650}.primary{border:0;background:var(--p);color:white}.full{width:100%}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:15}.bottom button{border:0;background:none;color:var(--muted);display:grid;gap:3px;justify-items:center;font-size:11px;min-width:65px}.bottom button b{font-size:23px;font-weight:400}.bottom button.on{color:var(--p)}main{padding-bottom:92px}.panel{padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:10px}.field{display:grid;gap:5px;font-weight:600;font-size:13px}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;background:#fff;color:#30262a}.field textarea{min-height:65px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);padding:17px;border-radius:17px}.stat strong{font-size:23px;display:block;color:var(--p)}.stat span{font-size:12px;color:var(--muted)}.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item .emoji{font-size:35px;background:#fff0e9;padding:9px;border-radius:14px}.item .info{flex:1;min-width:0}.item .info strong{display:block}.item .info small{color:var(--muted)}.pill{font-size:11px;border-radius:12px;padding:5px 8px;background:var(--p2);color:#70344b}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:38px 12px;color:var(--muted)}.empty span{font-size:52px;display:block}.note{background:#fff3d9;border-radius:13px;padding:12px;font-size:13px;color:#785c2d}.overlay{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:15px}.modal{background:var(--surface);border-radius:24px;padding:22px;max-width:430px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none!important}.danger{color:#ad344d}.tiny{font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tabs button{white-space:nowrap}.tabs .on{background:var(--p);color:white}.adminbar{background:#fff1e8;border-radius:16px;padding:12px;margin-bottom:12px}.footer{color:var(--muted);text-align:center;font-size:12px;padding:24px}.swatches{display:flex;gap:10px}.swatch{width:37px;height:37px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.hero{padding:35px}.hero h1{font-size:38px}.grid{grid-template-columns:repeat(4,1fr)}}
<style>nav.bottom{display:flex;gap:3px;justify-content:space-around}nav.bottom button{min-width:0;flex:1;padding:8px 2px;font-size:10px}nav.bottom button b{font-size:20px}input,textarea,select{max-width:100%;color:#33202a} .panel,.card{overflow-wrap:anywhere} .note{overflow-wrap:anywhere} @media(max-width:390px){.brand{font-size:17px}.headright{gap:5px}}</style></style></head><body><header><div class="wrap"><div class="brand">🍬 <span id="brand">Doce Ateliê</span><small>DOCINHOS GOURMET</small></div><div class="headright"><button class="iconbtn" onclick="navigate('cart')" aria-label="Carrinho">🛍️ <span id="cartcount">0</span></button><button class="iconbtn" onclick="openAccess()" aria-label="Área administrativa">⚙️</button></div></div></header><main class="wrap" id="main"></main><nav class="bottom" id="nav"></nav><div id="modalhost"></div><script>
const seed=[{id:1,name:'Brigadeiro belga',cat:'Brigadeiros',desc:'Chocolate belga 54% e granulado premium',price:6.5,cost:2.35,stock:45,emoji:'🍫',active:true},{id:2,name:'Beijinho de coco',cat:'Clássicos',desc:'Coco fresco e leite condensado artesanal',price:5.5,cost:1.85,stock:32,emoji:'🥥',active:true},{id:3,name:'Morango encantado',cat:'Especiais',desc:'Morango com creme e cobertura delicada',price:9.9,cost:4.1,stock:16,emoji:'🍓',active:true},{id:4,name:'Pistache supreme',cat:'Especiais',desc:'Brigadeiro de pistache com toque crocante',price:8.5,cost:3.6,stock:21,emoji:'💚',active:true},{id:5,name:'Ninho com Nutella',cat:'Brigadeiros',desc:'Leite Ninho e recheio cremoso de avelã',price:7.5,cost:3.05,stock:38,emoji:'🍥',active:true},{id:6,name:'Caixa presente 6 un.',cat:'Presentes',desc:'Seleção especial para presentear',price:36,cost:15.5,stock:12,emoji:'🎁',active:true}];
const KEY='doce-atelier-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{products:seed,orders:[],settings:{name:'Doce Ateliê',whatsapp:'',deliveryFee:7,minimum:0,color:'#a84e6e'},nextId:7};let page='home',cat='Todos',query='',cart={},admin=false,tab='dashboard';db.customer=db.customer||{name:'',phone:'',address:'',notes:''};db.settings.pixKey=db.settings.pixKey||'';db.settings.pixName=db.settings.pixName||'';const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function setTheme(c){document.documentElement.style.setProperty('--p',c);db.settings.color=c;save()}setTheme(db.settings.color);function notify(s){alert(s)}function navigate(p){page=p;render();window.scrollTo(0,0)}function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}function render(){document.getElementById('brand').textContent=db.settings.name;document.getElementById('cartcount').textContent=count();document.getElementById('main').innerHTML=admin?renderAdmin():page==='home'?renderHome():page==='cart'?renderCart():page==='orders'?renderOrders():page==='profile'?renderProfile():renderContact();document.getElementById('nav').innerHTML=(admin?[['dashboard','📊','Painel'],['products','🍬','Produtos'],['deliveries','🚚','Entregas'],['stock','📦','Estoque'],['settings','⚙️','Ajustes']]:[['home','🏠','Início'],['cart','🛒','Carrinho'],['orders','🧾','Pedidos'],['profile','👤','Minha conta'],['contact','💬','Contato']]).map(([id,ic,label])=>`<button class="${(admin?tab:page)===id?'on':''}" onclick="${admin?`tab='${id}';render()`:`navigate('${id}')`}"><b>${ic}</b>${label}</button>`).join('')}
function renderHome(){const categories=['Todos',...new Set(db.products.filter(p=>p.active).map(p=>p.cat))];let prods=db.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase())));return `<div class="hero"><div><span class="tag">✨ Feitos com carinho</span><h1>Pequenos doces,<br>grandes momentos.</h1><p>Encomende seus favoritos com poucos toques.</p></div><div class="art">🧁</div></div><div class="section"><h2>Nosso cardápio</h2><span class="muted tiny">${prods.length} opções</span></div><input class="search" placeholder="🔎  Qual docinho você procura?" value="${esc(query)}" oninput="query=this.value;updateGrid()"><div class="chips">${categories.map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div id="productGrid">${cards(prods)}</div><div class="footer">Feito com amor, um docinho de cada vez 💗</div>`}
function cards(ps){return ps.length?`<div class="grid">${ps.map(p=>`<div class="card"><div class="pic">${esc(p.emoji)}</div><div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="row"><span class="price">${money(p.price)}</span><button class="btn primary" ${p.stock<1?'disabled':''} onclick="add(${p.id})">${p.stock<1?'Esgotado':'＋'}</button></div><small class="muted">${p.stock>0?'Disponível':'Indisponível'}</small></div></div>`).join('')}</div>`:'<div class="empty"><span>🍬</span>Nenhum docinho encontrado.</div>'}function updateGrid(){document.getElementById('productGrid').innerHTML=cards(db.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase()))))}function add(id){let p=db.products.find(p=>p.id===id);if(!p||!p.active||p.stock<=(cart[id]||0))return notify('Quantidade indisponível');cart[id]=(cart[id]||0)+1;render()}function qty(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];render()}function total(){return Object.entries(cart).reduce((a,[id,q])=>a+(db.products.find(p=>p.id===+id)?.price||0)*q,0)}
function renderCart(){let entries=Object.entries(cart);return `<div class="section"><h2>Meu carrinho</h2></div>${entries.length?`<div class="panel">${entries.map(([id,q])=>{let p=db.products.find(p=>p.id===+id);return p?`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${money(p.price)} cada</small></div><button class="btn" onclick="qty(${id},-1)">−</button><b>${q}</b><button class="btn" onclick="add(${id})">+</button></div>`:''}).join('')}</div><div class="panel stack"><div class="row"><span>Subtotal</span><b>${money(total())}</b></div><div class="row"><span>Entrega (se escolhida)</span><b>${money(db.settings.deliveryFee)}</b></div><div class="note">O valor de entrega será adicionado apenas se você escolher entrega.</div><button class="btn primary full" onclick="checkout()">Finalizar pedido →</button></div>`:'<div class="empty"><span>🛒</span>Seu carrinho está vazio.<p><button class="btn primary" onclick="navigate(\'home\')">Ver cardápio</button></p></div>'}`}
function checkout(){if(!count())return;showModal(`<h2>Finalizar pedido</h2><form class="stack" onsubmit="placeOrder(event)"><label class="field">Seu nome<input name="customer" required maxlength="80" value="${esc(db.customer.name)}" placeholder="Como podemos chamar você?"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="${esc(db.customer.phone)}" placeholder="(41) 99999-9999"></label><label class="field">Recebimento<select name="method" onchange="document.getElementById('addressfield').classList.toggle('hidden',this.value!=='Entrega')"><option>Retirada</option><option>Entrega</option></select></label><label class="field hidden" id="addressfield">Endereço de entrega<textarea name="address" placeholder="Rua, número, bairro, complemento">${esc(db.customer.address)}></textarea></label><label class="field">Observações<textarea name="notes" placeholder="Ex.: sem confeitos, horário preferido"></textarea></label><label class="field">Pagamento<select name="payment"><option value="Na retirada">Pagar na retirada</option><option value="Pix">Pix (instruções manuais)</option></select></label><div class="note">Pix demonstrativo: não gera cobrança automática e não confirma pagamento pelo banco.</div><button class="btn primary full">Confirmar pedido</button><button type="button" class="btn full" onclick="closeModal()">Voltar</button></form>`)}function placeOrder(e){e.preventDefault();const f=new FormData(e.target),method=f.get('method'),address=String(f.get('address')||'').trim();if(method==='Entrega'&&!address)return notify('Informe o endereço de entrega');for(let [id,q] of Object.entries(cart)){let p=db.products.find(x=>x.id===+id);if(!p||p.stock<q)return notify('Estoque alterado. Revise o carrinho.')}let items=Object.entries(cart).map(([id,q])=>{let p=db.products.find(x=>x.id===+id);return {id:+id,name:p.name,qty:q,price:p.price,cost:p.cost}});for(let i of items)db.products.find(p=>p.id===i.id).stock-=i.qty;db.customer={name:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),address,notes:String(f.get('notes')||'')};let order={payment:String(f.get('payment')||'Na retirada'),paymentStatus:'Não confirmado',id:Date.now(),created:new Date().toISOString(),customer:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),method,address,notes:String(f.get('notes')||''),items,subtotal:total(),fee:method==='Entrega'?+db.settings.deliveryFee:0,status:'Recebido'};db.orders.unshift(order);cart={};save();closeModal();page='orders';render();notify('Pedido registrado neste dispositivo! Para encomendas reais, a loja precisará de um servidor compartilhado.')}function renderOrders(){return `<div class="section"><h2>Pedidos neste aparelho</h2></div><div class="note">Demonstração local: pedidos de outros celulares não aparecem aqui.</div>${db.orders.length?db.orders.map(o=>`<div class="panel"><div class="row"><b>Pedido #${String(o.id).slice(-6)}</b><span class="pill">${esc(o.status)}</span></div><p class="muted tiny">${new Date(o.created).toLocaleString('pt-BR')} · ${esc(o.method)}</p><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</p><p class="muted tiny">Pagamento: ${esc(o.payment||'Na retirada')} · ${esc(o.paymentStatus||'Não confirmado')}</p>${o.payment==='Pix'&&db.settings.pixKey?`<div class="note"><b>Pix da loja</b><p>Chave: <strong>${esc(db.settings.pixKey)}</strong></p><button class="btn" onclick="navigator.clipboard?.writeText(db.settings.pixKey).then(()=>notify('Chave Pix copiada'))">Copiar chave</button><p class="tiny">A confirmação é manual. Não marque como pago sem verificar o extrato.</p></div>`:''}<div class="row"><b>${money(o.subtotal+o.fee)}</b><button class="btn" onclick="shareOrder(${o.id})">💬 Compartilhar</button></div></div>`).join(''):'<div class="empty"><span>🧾</span>Você ainda não fez pedidos.</div>'}`}
function message(o){return `Olá! Pedido #${String(o.id).slice(-6)} de ${o.customer}:\n${o.items.map(i=>`${i.qty}x ${i.name}`).join('\n')}\n${o.method}${o.address?' - '+o.address:''}\nTotal: ${money(o.subtotal+o.fee)}\nObs: ${o.notes}`};function shareOrder(id){let o=db.orders.find(o=>o.id===id);let number=db.settings.whatsapp.replace(/\D/g,'');if(number)window.open(`https://wa.me/${number}?text=${encodeURIComponent(message(o))}`,'_blank','noopener');else if(navigator.share)navigator.share({text:message(o)}).catch(()=>{});else navigator.clipboard?.writeText(message(o)).then(()=>notify('Pedido copiado. Configure WhatsApp da loja para envio direto.'))}function renderProfile(){return `<div class="section"><h2>👤 Minha conta</h2></div><div class="panel"><p class="muted">Salve seus dados para preencher seus próximos pedidos automaticamente neste aparelho.</p><form class="stack" onsubmit="saveProfile(event)"><label class="field">Nome<input name="name" required maxlength="80" value="${esc(db.customer.name)}"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="${esc(db.customer.phone)}"></label><label class="field">Endereço<textarea name="address">${esc(db.customer.address)}</textarea></label><label class="field">Preferências e observações<textarea name="notes">${esc(db.customer.notes)}</textarea></label><button class="btn primary full">Salvar meus dados</button></form></div><div class="note">Dados salvos apenas neste navegador, sem login real ou sincronização entre aparelhos.</div>`}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target);db.customer={name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),address:String(f.get('address')||'').trim(),notes:String(f.get('notes')||'').trim()};save();render();notify('Dados salvos neste aparelho')}
function renderContact(){return `<div class="section"><h2>Fale com a gente</h2></div><div class="panel stack"><div style="font-size:55px;text-align:center">💌</div><h2 style="text-align:center;margin:0">Um carinho em cada detalhe</h2><p class="muted" style="text-align:center">Dúvidas sobre sabores, encomendas e eventos? Entre em contato.</p><button class="btn primary full" onclick="contact()">💬 Conversar pelo WhatsApp</button></div><div class="panel"><b>Sobre o aplicativo</b><p class="muted">Catálogo, carrinho e pedidos demonstrativos. Os dados ficam somente neste navegador até conectar um backend.</p></div>`}function contact(){let n=db.settings.whatsapp.replace(/\D/g,'');if(!n)return notify('O WhatsApp da loja ainda não foi configurado.');window.open(`https://wa.me/${n}?text=${encodeURIComponent('Olá! Gostaria de saber mais sobre os docinhos gourmet.')}`,'_blank','noopener')}
function showModal(html){document.getElementById('modalhost').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalhost').innerHTML=''}function openAccess(){if(admin){admin=false;page='home';render();return}showModal(`<h2>🔐 Área administrativa</h2><p class="muted">Nesta demonstração, o acesso administrativo é apenas uma simulação visual.</p><div class="note">⚠️ Sem backend e autenticação, não há proteção real dos dados ou das funções administrativas. Não utilize para uma loja em produção.</div><div class="stack" style="margin-top:14px"><button class="btn primary full" onclick="admin=true;tab='dashboard';closeModal();render()">Entrar no painel de demonstração</button><button class="btn full" onclick="closeModal()">Continuar como cliente</button></div>`)}
function renderAdmin(){return `<div class="adminbar row"><div><b>🛡️ Gestão da loja</b><div class="tiny muted">Modo demonstração · acesso não protegido</div></div><button class="btn" onclick="admin=false;page='home';render()">Sair</button></div><div class="tabs">${[['dashboard','Visão geral'],['products','Produtos'],['deliveries','Pedidos'],['stock','Estoque'],['settings','Configurações']].map(([k,t])=>`<button class="btn ${tab===k?'on':''}" onclick="tab='${k}';render()">${t}</button>`).join('')}</div>${tab==='dashboard'?adminDashboard():tab==='products'?adminProducts():tab==='deliveries'?adminOrders():tab==='stock'?adminStock():adminSettings()}`}
function adminDashboard(){let gross=db.orders.filter(o=>o.status!=='Cancelado').reduce((a,o)=>a+o.subtotal,0),cost=db.orders.filter(o=>o.status!=='Cancelado').reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.qty*i.cost,0),0),pending=db.orders.filter(o=>!['Entregue','Concluído','Cancelado'].includes(o.status)).length;return `<div class="section"><h2>Dashboard</h2><span class="pill">Admin demo</span></div><div class="stats"><div class="stat"><strong>${db.orders.length}</strong><span>Pedidos registrados</span></div><div class="stat"><strong>${money(gross)}</strong><span>Receita de produtos*</span></div><div class="stat"><strong>${money(gross-cost)}</strong><span>Lucro bruto estimado*</span></div><div class="stat"><strong>${pending}</strong><span>Pedidos em aberto</span></div></div><div class="panel"><h3>📈 Resumo do negócio</h3><p>Produtos cadastrados: <b>${db.products.length}</b></p><p>Itens com estoque baixo (≤ 5): <b>${db.products.filter(p=>p.stock<=5).length}</b></p><p class="muted tiny">* Estimativas sem impostos, taxas, despesas fixas, perdas ou custo de entrega. Pedidos cancelados excluídos; os demais são incluídos independentemente de pagamento.</p></div><div class="panel"><h3>Últimos pedidos</h3>${db.orders.slice(0,4).map(o=>`<div class="item"><div class="emoji">🧾</div><div class="info"><strong>${esc(o.customer)}</strong><small>${esc(o.status)} · ${esc(o.method)}</small></div><b>${money(o.subtotal+o.fee)}</b></div>`).join('')||'<p class="muted">Nenhum pedido ainda.</p>'}</div>`}
function adminProducts(){return `<div class="section"><h2>Catálogo</h2><button class="btn primary" onclick="editProduct()">＋ Novo doce</button></div><div class="panel">${db.products.map(p=>`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${money(p.price)} · custo ${money(p.cost)} · ${p.active?'Visível':'Oculto'}</small><small style="display:block">Margem bruta: ${p.price>0?(((p.price-p.cost)/p.price)*100).toFixed(1):0}%</small></div><button class="btn" onclick="editProduct(${p.id})">Editar</button></div>`).join('')}</div>`}function editProduct(id){let p=db.products.find(p=>p.id===id)||{name:'',cat:'Brigadeiros',desc:'',price:0,cost:0,stock:0,emoji:'🍬',active:true};showModal(`<h2>${id?'Editar doce':'Novo doce'}</h2><form class="stack" onsubmit="saveProduct(event,${id||0})"><label class="field">Nome<input name="name" required maxlength="70" value="${esc(p.name)}"></label><label class="field">Categoria<input name="cat" required maxlength="40" value="${esc(p.cat)}"></label><label class="field">Descrição<textarea name="desc">${esc(p.desc)}</textarea></label><div class="two"><label class="field">Preço (R$)<input type="number" name="price" min="0.01" step="0.01" required value="${p.price}"></label><label class="field">Custo unitário (R$)<input type="number" name="cost" min="0" step="0.01" required value="${p.cost}"></label></div><div class="two"><label class="field">Estoque<input type="number" name="stock" min="0" step="1" required value="${p.stock}"></label><label class="field">Emoji / ícone<input name="emoji" maxlength="8" value="${esc(p.emoji)}"></label></div><label><input type="checkbox" name="active" ${p.active?'checked':''}> Exibir no cardápio</label><button class="btn primary full">Salvar doce</button><button type="button" class="btn full" onclick="closeModal()">Cancelar</button></form>`)}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),p={id:id||db.nextId++,name:String(f.get('name')).trim(),cat:String(f.get('cat')).trim(),desc:String(f.get('desc')).trim(),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),emoji:String(f.get('emoji')).trim()||'🍬',active:f.has('active')};if(p.price<=0||p.cost<0||p.stock<0)return notify('Revise os valores');let idx=db.products.findIndex(x=>x.id===id);if(idx>=0)db.products[idx]=p;else db.products.push(p);save();closeModal();render()}
const statuses=['Recebido','Em preparo','Pronto','Saiu para entrega','Entregue','Concluído','Cancelado'];function adminOrders(){return `<div class="section"><h2>Pedidos e entregas</h2></div>${db.orders.length?db.orders.map(o=>`<div class="panel"><div class="row"><b>#${String(o.id).slice(-6)} · ${esc(o.customer)}</b><b>${money(o.subtotal+o.fee)}</b></div><p class="muted tiny">${esc(o.phone)} · ${esc(o.method)} ${o.address?'· '+esc(o.address):''}</p><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</p><label class="field">Situação<select onchange="setStatus(${o.id},this.value)">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label><p class="tiny muted">${esc(o.notes||'Sem observações')}</p></div>`).join(''):'<div class="empty"><span>🚚</span>Nenhum pedido cadastrado.</div>'}`}function setStatus(id,s){let o=db.orders.find(o=>o.id===id);if(!o)return;if(s==='Cancelado'&&o.status!=='Cancelado'){for(let i of o.items){let p=db.products.find(p=>p.id===i.id);if(p)p.stock+=i.qty}}else if(o.status==='Cancelado'&&s!=='Cancelado'){for(let i of o.items){let p=db.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return notify('Estoque insuficiente para reativar pedido')}for(let i of o.items)db.products.find(p=>p.id===i.id).stock-=i.qty}o.status=s;save();render()}function adminStock(){return `<div class="section"><h2>Controle de estoque</h2></div><div class="panel">${db.products.map(p=>`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${p.stock<=5?'⚠️ Estoque baixo':'Unidades disponíveis'}</small></div><button class="btn" onclick="adjust(${p.id},-1)">−</button><b>${p.stock}</b><button class="btn" onclick="adjust(${p.id},1)">+</button></div>`).join('')}</div><p class="muted tiny">O estoque é de unidades de produtos finais, não de ingredientes. Ajustes manuais são demonstrativos.</p>`}function adjust(id,n){let p=db.products.find(p=>p.id===id);p.stock=Math.max(0,p.stock+n);save();render()}
function adminSettings(){return `<div class="section"><h2>Configurações</h2></div><div class="panel"><form class="stack" onsubmit="saveSettings(event)"><label class="field">Nome da loja<input name="name" maxlength="50" required value="${esc(db.settings.name)}"></label><label class="field">WhatsApp da loja (com DDI 55)<input name="whatsapp" placeholder="5541999999999" value="${esc(db.settings.whatsapp)}"></label><label class="field">Chave Pix da loja<input name="pixKey" value="${esc(db.settings.pixKey||'')}" placeholder="Chave Pix para copiar"></label><label class="field">Nome do recebedor Pix<input name="pixName" value="${esc(db.settings.pixName||'')}" placeholder="Nome exibido ao cliente"></label><div class="note">A chave Pix é pública para o cliente. A confirmação de pagamento deve ser feita no banco; integração automática exige servidor e API de pagamentos.</div><div class="two"><label class="field">Taxa de entrega (R$)<input type="number" min="0" step="0.01" name="deliveryFee" value="${db.settings.deliveryFee}"></label><label class="field">Pedido mínimo (R$)*<input type="number" min="0" step="0.01" name="minimum" value="${db.settings.minimum}"></label></div><div class="field">Paletas harmônicas (cores da marca)<div class="swatches">${['#a84e6e','#6b579a','#247d74','#b66b43','#376e9b'].map(c=>`<button type="button" class="swatch" style="background:${c}" onclick="setTheme('${c}');render()" aria-label="Tema ${c}"></button>`).join('')}</div></div><label class="field">Cor principal personalizada<input type="color" name="color" value="${esc(db.settings.color)}"></label><button class="btn primary full">Salvar configurações</button></form><p class="muted tiny">* Pedido mínimo armazenado para futura integração; não aplicado nesta demonstração.</p></div><div class="panel stack"><h3>Dados de demonstração</h3><button class="btn" onclick="exportData()">⬇️ Exportar backup JSON</button><button class="btn danger" onclick="if(confirm('Apagar todos os dados locais e restaurar o exemplo?')){localStorage.removeItem(KEY);location.reload()}">Restaurar dados de exemplo</button></div><div class="note">Sem autenticação real. Qualquer pessoa com acesso ao código pode alterar os dados locais. Para produção, use API, autenticação e autorização de papéis no servidor.</div>`}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.settings.name=String(f.get('name')).trim();db.settings.pixKey=String(f.get('pixKey')||'').trim();db.settings.pixName=String(f.get('pixName')||'').trim();db.settings.whatsapp=String(f.get('whatsapp')).replace(/\D/g,'');db.settings.deliveryFee=Math.max(0,+f.get('deliveryFee'));db.settings.minimum=Math.max(0,+f.get('minimum'));setTheme(String(f.get('color')));save();render();notify('Configurações salvas neste dispositivo')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='doce-atelie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
