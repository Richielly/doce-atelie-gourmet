/* Layout mobile com barra fixa e conteúdo rolável sem cortes */
html,body{min-height:100%;max-width:100%;overflow-x:hidden}
body{padding-bottom:calc(94px + env(safe-area-inset-bottom));background:#f8f3f5}
header{position:sticky;top:0;z-index:20;background:#fffafc}
main.wrap{padding-bottom:30px;min-height:calc(100dvh - 180px)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;overflow-x:auto;overscroll-behavior-x:contain;background:#fff;box-shadow:0 -6px 20px #56304a18;padding:8px 5px calc(9px + env(safe-area-inset-bottom));gap:2px}

.tabs{display:none}
.panel,.card,.stat{min-width:0;max-width:100%;overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pic{aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.field input,.field textarea,.field select{max-width:100%;width:100%}
.modal{max-height:calc(100dvh - 35px);overflow-y:auto}
@media(max-width:390px){.wrap{padding-left:12px;padding-right:12px}.grid{gap:9px}nav.bottom button{font-size:9px}nav.bottom button b{font-size:19px}}

function stepChoice(id,delta){let p=db.products.find(x=>x.id===id),input=document.getElementById('chosenQty');let n=Number(input.value)||p.minQty||1;input.value=Math.min(p.stock-(cart[id]||0),Math.max(p.minQty||1,Math.floor(n)+delta*(p.qtyStep||1)));previewChoice(id)}

function updateGrid(){document.getElementById('productGrid').innerHTML=cards(db.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase()))))}function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=(cart[id]||0))return notify('Estoque insuficiente.');cart[id]=(cart[id]||0)+1;render()}
function qty(id,delta){let p=db.products.find(x=>x.id===+id);if(!p)return;let next=(cart[id]||0)+delta*(p.qtyStep||1);if(next===0)delete cart[id];else if(next<(p.minQty||1))return notify('Mínimo de '+(p.minQty||1)+' unidades. Use Remover para excluir.');else if(next>p.stock)return notify('Estoque insuficiente.');else if((next-(p.minQty||1))%(p.qtyStep||1)!==0)return notify('Quantidade fora dos incrementos permitidos.');else cart[id]=next;render()}
function removeCartItem(id){delete cart[id];render()}
function total(){return Object.entries(cart).reduce((a,[id,q])=>a+(db.products.find(p=>p.id===+id)?.price||0)*q,0)}
function renderCart(){let entries=Object.entries(cart).map(([id,q])=>({p:db.products.find(p=>p.id===+id),q,id})).filter(x=>x.p);return `<div class="section"><h2>Meu carrinho</h2><span class="muted tiny">${count()} unidades</span></div>${entries.length?`<div class="cart-products">${entries.map(({p,q,id})=>`<article class="cart-product"><div class="cart-product-top"><div class="cart-product-photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:esc(p.emoji||'🍬')}</div><div class="cart-product-info"><strong>${esc(p.name)}</strong><small>${displayPrice(p)}</small><small>Mínimo ${p.minQty||1} · incremento ${p.qtyStep||1}</small></div><button class="cart-remove" aria-label="Remover ${esc(p.name)}" onclick="removeCartItem(${id})">✕</button></div><div class="cart-product-bottom"><div class="cart-stepper"><button aria-label="Diminuir quantidade" onclick="qty(${id},-1)">−</button><span>${q} <small>un</small></span><button aria-label="Aumentar quantidade" onclick="qty(${id},1)">+</button></div><div class="cart-product-total"><small>Subtotal do produto</small><strong>${money(q*p.price)}</strong></div></div></article>`).join('')}</div><div class="panel stack cart-summary"><h3>Resumo do pedido</h3><div class="row"><span>${count()} unidades</span><b>${money(total())}</b></div><div class="row"><span>Taxa de entrega, se escolhida</span><b>${money(db.settings.deliveryFee)}</b></div><div class="note">A entrega será adicionada somente se selecionada na finalização.</div><button class="btn primary full" onclick="checkout()">Continuar para finalizar</button><button class="btn full" onclick="requestQuote()">Solicitar orçamento e agendamento</button></div>`:'<div class="empty">Seu carrinho está vazio.<p><button class="btn primary" onclick="navigate(\'home\')">Ver cardápio</button></p></div>'}`}
function checkout(){if(!count())return;showModal(`<h2>Finalizar pedido</h2><form class="stack" onsubmit="placeOrder(event)"><label class="field">Seu nome<input name="customer" required maxlength="80" value="${esc(db.customer.name)}" placeholder="Como podemos chamar você?"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="${esc(db.customer.phone)}" placeholder="(41) 99999-9999"></label><label class="field">Recebimento<select name="method" onchange="document.getElementById('addressfield').classList.toggle('hidden',this.value!=='Entrega')"><option>Retirada</option><option>Entrega</option></select></label><label class="field hidden" id="addressfield">Endereço de entrega<textarea name="address" placeholder="Rua, número, bairro, complemento">${esc(db.customer.address)}></textarea></label><label class="field">Código do voucher (opcional)<input name="voucherCode" maxlength="24" placeholder="Ex.: DOCE-AB1234"><small>Brinde sujeito à confirmação pela loja; não altera o valor cobrado.</small></label><label class="field">Observações<textarea name="notes" placeholder="Ex.: sem confeitos, horário preferido"></textarea></label><label class="field">Pagamento<select name="payment"><option value="Na retirada">Pagar na retirada</option><option value="Pix">Pix (instruções manuais)</option></select></label><div class="note">Pix demonstrativo: não gera cobrança automática e não confirma pagamento pelo banco.</div><button class="btn primary full">Confirmar pedido</button><button type="button" class="btn full" onclick="closeModal()">Voltar</button></form>`)}function placeOrder(e){e.preventDefault();const f=new FormData(e.target),method=f.get('method'),address=String(f.get('address')||'').trim();if(method==='Entrega'&&!address)return notify('Informe o endereço de entrega');for(let [id,q] of Object.entries(cart)){let p=db.products.find(x=>x.id===+id);if(!p||p.stock<q||q<(p.minQty||1)||(q-(p.minQty||1))%(p.qtyStep||1)!==0)return notify('Revise a quantidade mínima e os incrementos do carrinho.')}let items=Object.entries(cart).map(([id,q])=>{let p=db.products.find(x=>x.id===+id);return {id:+id,name:p.name,qty:q,price:p.price,cost:p.cost}});for(let i of items)db.products.find(p=>p.id===i.id).stock-=i.qty;db.customer={name:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),address,notes:String(f.get('notes')||'')};let order={payment:String(f.get('payment')||'Na retirada'),paymentStatus:'Não confirmado',id:Date.now(),created:new Date().toISOString(),customer:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),method,address,notes:String(f.get('notes')||''),items,subtotal:total(),fee:method==='Entrega'?+db.settings.deliveryFee:0,status:'Recebido',loyaltyCredited:false,voucherCode:String(f.get('voucherCode')||'').trim().toUpperCase()};if(order.voucherCode){let v=validVoucher(order.voucherCode,order.phone);if(!v)return notify('Voucher inválido, vencido ou já utilizado.');v.status='reservado';v.orderId=order.id;}db.orders.unshift(order);cart={};save();closeModal();page='orders';render();notify('Pedido registrado neste dispositivo! Para encomendas reais, a loja precisará de um servidor compartilhado.')}
function quoteDateOpen(date,excludeQuote){let b=db.booking;let d=new Date(date+'T12:00:00');if(!b.dates.includes(date)||Number.isNaN(d.getTime()))return false;let min=new Date();min.setHours(12,0,0,0);min.setDate(min.getDate()+Math.max(0,+b.leadDays||0));if(d<min)return false;let occupied=db.quotes.filter(q=>q.id!==excludeQuote&&q.date===date&&!['Rejeitado','Cancelado'].includes(q.status)&&q.storeApproved).length+db.orders.filter(o=>o.scheduledDate===date&&o.quoteId==null&&o.status!=='Cancelado').length;return occupied<Math.max(1,+b.capacity||1)}
function quoteDates(selected){return (db.booking.dates||[]).slice().sort().filter(d=>quoteDateOpen(d,selected)).map(d=>'<option value="'+esc(d)+'">'+new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+'</option>').join('')}
function requestQuote(){if(!count())return notify('Adicione produtos ao carrinho.');let dates=quoteDates();if(!dates)return notify('A loja ainda não liberou datas para agendamento.');showModal('<h2>📅 Solicitar orçamento</h2><p class="muted">Escolha uma data liberada pela loja. O pedido só será criado depois que ambas as partes aprovarem o orçamento.</p><form class="stack" onsubmit="submitQuote(event)"><label class="field">Nome<input name="customer" required maxlength="80" value="'+esc(db.customer.name||'')+'"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="'+esc(db.customer.phone||'')+'"></label><label class="field">Data desejada<select name="date" required>'+dates+'</select></label><label class="field">Modalidade<select name="method" onchange="this.form.querySelector(\'#quoteAddress\').classList.toggle(\'hidden\',this.value!==\'Entrega\')"><option>Retirada</option><option>Entrega</option></select></label><label class="field hidden" id="quoteAddress">Endereço<textarea name="address">'+esc(db.customer.address||'')+'</textarea></label><label class="field">Detalhes e observações<textarea name="notes" maxlength="800"></textarea></label><div class="note">Valor inicial dos produtos: '+money(total())+'. A loja poderá ajustar o valor final, incluindo a entrega, antes da aprovação.</div><button class="btn primary full">Enviar solicitação</button></form>')}
function submitQuote(e){e.preventDefault();let f=new FormData(e.target),date=String(f.get('date')||''),method=String(f.get('method')||'Retirada'),address=String(f.get('address')||'').trim();if(!quoteDateOpen(date))return notify('Data indisponível. Escolha outra.');if(method==='Entrega'&&!address)return notify('Informe o endereço.');let items=Object.entries(cart).map(([id,qty])=>{let p=db.products.find(p=>p.id===+id);return p?{id:p.id,name:p.name,qty:+qty,price:p.price,cost:p.cost}:null}).filter(Boolean);if(!items.length)return;for(let i of items){let p=db.products.find(p=>p.id===i.id);if(i.qty<(p.minQty||1)||(i.qty-(p.minQty||1))%(p.qtyStep||1)!==0)return notify('Revise as quantidades.')}let q={id:Date.now(),created:new Date().toISOString(),customer:String(f.get('customer')||'').trim(),phone:String(f.get('phone')||'').trim(),date,method,address,notes:String(f.get('notes')||'').trim(),items,subtotal:items.reduce((s,i)=>s+i.price*i.qty,0),fee:method==='Entrega'?(+db.settings.deliveryFee||0):0,status:'Solicitado',storeApproved:false,customerApproved:false,revision:1,history:[{at:new Date().toISOString(),event:'Orçamento solicitado'}]};db.quotes.unshift(q);db.customer.name=q.customer;db.customer.phone=q.phone;cart={};save();closeModal();navigate('quotes');notify('Orçamento registrado neste navegador. Envie os detalhes à loja para análise.')}
function quoteTotal(q){return (+q.subtotal||0)+(+q.fee||0)}
function quoteHistory(q,event){(q.history||(q.history=[])).push({at:new Date().toISOString(),event})}
function renderQuotes(){let phone=loyaltyKey(db.customer.phone),quotes=db.quotes.filter(q=>phone&&loyaltyKey(q.phone)===phone);return '<div class="section"><h2>📅 Meus orçamentos</h2></div><div class="note">Demonstração local: cliente e lojista devem usar este mesmo navegador. Não há envio automático nem sincronização entre aparelhos.</div>'+(quotes.map(q=>'<div class="panel stack"><div class="row"><b>Orçamento #'+String(q.id).slice(-6)+'</b><span class="pill">'+esc(q.status)+'</span></div><p class="muted tiny">Data: '+new Date(q.date+'T12:00:00').toLocaleDateString('pt-BR')+' · '+esc(q.method)+'</p><p>'+q.items.map(i=>i.qty+' × '+esc(i.name)).join(', ')+'</p><div class="row"><span>Valor proposto</span><b>'+money(quoteTotal(q))+'</b></div><p class="muted tiny">'+(q.storeApproved?'✓ Loja aprovou':'⏳ Aguardando loja')+' · '+(q.customerApproved?'✓ Cliente aprovou':'⏳ Aguardando cliente')+'</p>'+(q.status==='Aguardando cliente'&&q.storeApproved?'<button class="btn primary full" onclick="approveQuoteCustomer('+q.id+')">✓ Aceitar proposta e converter em pedido</button><button class="btn full" onclick="rejectQuote('+q.id+',false)">Recusar proposta</button>':'')+(q.status==='Solicitado'?'<button class="btn full" onclick="rejectQuote('+q.id+',false)">Cancelar solicitação</button>':'')+(q.orderId?'<p class="note">Pedido criado: #'+String(q.orderId).slice(-6)+'</p>':'')+'<details><summary>Histórico de aprovação</summary>'+(q.history||[]).map(x=>'<p class="tiny muted">'+new Date(x.at).toLocaleString('pt-BR')+' · '+esc(x.event)+'</p>').join('')+'</details></div>').join('')||'<div class="panel">Você ainda não solicitou orçamentos. Monte um carrinho e escolha “Solicitar orçamento”.</div>')}
function approveQuoteCustomer(id){let q=db.quotes.find(q=>q.id===id);if(!q||q.status!=='Aguardando cliente'||!q.storeApproved||q.customerApproved)return notify('Proposta indisponível.');if(loyaltyKey(db.customer.phone)!==loyaltyKey(q.phone))return notify('Confira o WhatsApp cadastrado em Minha conta.');if(!quoteDateOpen(q.date,q.id))return notify('A data não está mais disponível. Solicite nova análise.');for(let i of q.items){let p=db.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return notify('Estoque insuficiente para '+i.name+'. Solicite revisão à loja.')}if(!confirm('Confirma o pedido de '+money(quoteTotal(q))+' para '+new Date(q.date+'T12:00:00').toLocaleDateString('pt-BR')+'?'))return;for(let i of q.items)db.products.find(p=>p.id===i.id).stock-=i.qty;let order={id:Date.now(),created:new Date().toISOString(),customer:q.customer,phone:q.phone,method:q.method,address:q.address,notes:q.notes,items:q.items.map(i=>({...i})),subtotal:q.subtotal,fee:q.fee,status:'Recebido',payment:'A combinar',paymentStatus:'Não confirmado',loyaltyCredited:false,quoteId:q.id,scheduledDate:q.date};db.orders.unshift(order);q.customerApproved=true;q.status='Convertido em pedido';q.orderId=order.id;quoteHistory(q,'Cliente aprovou. Pedido #'+order.id+' criado.');save();render();notify('Pedido agendado! A confirmação de pagamento é separada.')}
function rejectQuote(id,store){let q=db.quotes.find(q=>q.id===id);if(!q||['Convertido em pedido','Rejeitado','Cancelado'].includes(q.status))return;if(!confirm('Confirma o cancelamento deste orçamento?'))return;q.status=store?'Rejeitado':'Cancelado';quoteHistory(q,store?'Loja rejeitou a proposta':'Cliente cancelou a proposta');save();render()}

let bookingMonth=new Date().toISOString().slice(0,7),bookingSelection='day',bookingSelectedDay='',bookingSelectedDays=[];
function bookingDateString(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function bookingShiftMonth(delta){let [y,m]=bookingMonth.split('-').map(Number),v=new Date(y,m-1+delta,1);bookingMonth=bookingDateString(v.getFullYear(),v.getMonth()+1,1).slice(0,7);render()}
function bookingSetSelection(v){bookingSelection=v;bookingSelectedDays=[];render()}
function bookingPickDay(date){if(bookingSelection==='day'){bookingSelectedDays=bookingSelectedDays.includes(date)?bookingSelectedDays.filter(x=>x!==date):[...bookingSelectedDays,date].sort()}else bookingSelectedDay=date;render()}
function bookingSelectionDates(date){let [y,m,d]=date.split('-').map(Number),start=new Date(y,m-1,d),dates=[];if(bookingSelection==='month'){start=new Date(y,m-1,1);let n=new Date(y,m,0).getDate();for(let i=1;i<=n;i++)dates.push(bookingDateString(y,m,i))}else if(bookingSelection==='week'||bookingSelection==='weekend'){let day=start.getDay(),monday=new Date(start);monday.setDate(start.getDate()-((day+6)%7));for(let i=0;i<7;i++){let x=new Date(monday);x.setDate(monday.getDate()+i);if(bookingSelection==='weekend'&&![0,6].includes(x.getDay()))continue;dates.push(bookingDateString(x.getFullYear(),x.getMonth()+1,x.getDate()))}}else dates=[date];return dates.filter(d=>d>=todayISO())}
function bookingApply(date,open){let dates=bookingSelection==='day'?bookingSelectedDays.filter(d=>d>=todayISO()):bookingSelectionDates(date);if(!dates.length)return notify('Toque nos dias do calendário que deseja selecionar.');let existing=new Set(db.booking.dates);for(let d of dates){if(open)existing.add(d);else existing.delete(d)}db.booking.dates=[...existing].sort();save();render();notify(dates.length+' dia(s) '+(open?'liberados':'bloqueados')+'. Orçamentos existentes não são cancelados.')}
function bookingCalendar(){let [y,m]=bookingMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,count=new Date(y,m,0).getDate(),days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],today=todayISO(),opened=new Set(db.booking.dates);let cells=days.map(d=>'<div class="booking-weekday">'+d+'</div>').join('');for(let i=0;i<offset;i++)cells+='<span></span>';for(let i=1;i<=count;i++){let date=bookingDateString(y,m,i),isOpen=opened.has(date),past=date<today;let n=db.quotes.filter(q=>q.date===date&&q.storeApproved&&!['Rejeitado','Cancelado'].includes(q.status)).length;cells+='<button type="button" class="booking-day '+(isOpen?'booking-open':'booking-closed')+(past?' booking-past':'')+(bookingSelection==='day'&&bookingSelectedDays.includes(date)?' booking-picked':'')+'" '+(past?'disabled':'')+' onclick="bookingPickDay(\''+date+'\')" aria-label="'+date+' '+(isOpen?'liberado':'bloqueado')+'"><b>'+i+'</b><small>'+(isOpen?'✓ Livre':'Bloq.')+'</small>'+(n?'<em>'+n+' reserva(s)</em>':'')+'</button>'}let selected=bookingSelectedDay&&bookingSelectedDay.startsWith(bookingMonth)?bookingSelectedDay:bookingDateString(y,m,Math.max(1,Math.min(count,new Date().getMonth()+1===m&&new Date().getFullYear()===y?new Date().getDate():1)));if(selected<today)selected=today;let targets=bookingSelection==='day'?bookingSelectedDays:bookingSelectionDates(selected),range=bookingSelection==='month'?'todo o mês':bookingSelection==='week'?'a semana':bookingSelection==='weekend'?'o final de semana':'o dia';return '<p class="muted tiny">'+(bookingSelection==='day'?'Toque em vários dias para marcá-los. Toque novamente para desmarcar.':'Escolha uma data de referência para aplicar a seleção.')+'</p><div class="booking-toolbar"><button class="btn" onclick="bookingShiftMonth(-1)" aria-label="Mês anterior">‹</button><strong>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</strong><button class="btn" onclick="bookingShiftMonth(1)" aria-label="Próximo mês">›</button></div><div class="booking-modes">'+[['day','Dia'],['week','Semana'],['weekend','Fim de semana'],['month','Mês inteiro']].map(([id,label])=>'<button class="'+(bookingSelection===id?'active':'')+'" onclick="bookingSetSelection(\''+id+'\')">'+label+'</button>').join('')+'</div><div class="booking-grid">'+cells+'</div><div class="booking-actions"><p><b>Selecionado:</b> '+new Date(selected+'T12:00:00').toLocaleDateString('pt-BR')+' · '+range+' ('+targets.length+' dia(s))</p><div class="booking-action-buttons"><button class="btn primary" onclick="bookingApply(\''+selected+'\',true)">✓ Liberar</button><button class="btn" onclick="bookingApply(\''+selected+'\',false)">⊘ Bloquear</button></div></div><div class="booking-legend"><span>🟢 Liberado</span><span>⚪ Bloqueado</span><span>🔢 Reservas aprovadas</span></div>'}
function adminBooking(){let b=db.booking;return '<div class="section"><h2>📅 Agenda e orçamentos</h2></div><div class="panel"><h3>Disponibilidade para encomendas</h3><p class="muted">Escolha dia, semana, fim de semana ou mês inteiro. Toque numa data e depois em Liberar ou Bloquear.</p>'+bookingCalendar()+'<form class="stack" onsubmit="saveBookingRules(event)"><div class="two"><label class="field">Limite por dia<input type="number" name="capacity" min="1" max="200" step="1" required value="'+b.capacity+'"></label><label class="field">Antecedência (dias)<input type="number" name="leadDays" min="0" max="365" step="1" required value="'+b.leadDays+'"></label></div><button class="btn full">Salvar regras da agenda</button></form></div><div class="section"><h3>Solicitações de orçamento</h3></div>'+(db.quotes.map(q=>'<div class="panel stack"><div class="row"><b>#'+String(q.id).slice(-6)+' · '+esc(q.customer)+'</b><span class="pill">'+esc(q.status)+'</span></div><p class="muted tiny">'+esc(q.phone)+' · '+new Date(q.date+'T12:00:00').toLocaleDateString('pt-BR')+' · '+esc(q.method)+'</p><p>'+q.items.map(i=>i.qty+' × '+esc(i.name)).join(', ')+'</p><div class="row"><span>Valor atual</span><b>'+money(quoteTotal(q))+'</b></div>'+(q.status==='Solicitado'||q.status==='Aguardando cliente'?'<form class="stack" onsubmit="approveQuoteStore(event,'+q.id+')"><div class="two"><label class="field">Produtos (R$)<input type="number" min="0" step=".01" name="subtotal" required value="'+q.subtotal+'"></label><label class="field">Entrega (R$)<input type="number" min="0" step=".01" name="fee" required value="'+q.fee+'"></label></div><label class="field">Data confirmada<select name="date" required><option value="'+esc(q.date)+'">'+new Date(q.date+'T12:00:00').toLocaleDateString('pt-BR')+' (atual)</option>'+quoteDates(q.id).replace('value="'+esc(q.date)+'"','value="'+esc(q.date)+'" disabled')+'</select></label><button class="btn primary full">✓ Aprovar e enviar proposta ao cliente</button></form><button class="btn full" onclick="rejectQuote('+q.id+',true)">Recusar orçamento</button>':'')+(q.orderId?'<div class="note">Convertido em pedido #'+String(q.orderId).slice(-6)+'</div>':'')+'<details><summary>Histórico</summary>'+(q.history||[]).map(x=>'<p class="tiny muted">'+new Date(x.at).toLocaleString('pt-BR')+' · '+esc(x.event)+'</p>').join('')+'</details></div>').join('')||'<div class="panel">Nenhuma solicitação recebida neste navegador.</div>')}
function saveBookingRules(e){e.preventDefault();let f=new FormData(e.target),capacity=+f.get('capacity'),leadDays=+f.get('leadDays');if(!Number.isInteger(capacity)||capacity<1||capacity>200||!Number.isInteger(leadDays)||leadDays<0||leadDays>365)return notify('Revise os limites da agenda.');db.booking.capacity=capacity;db.booking.leadDays=leadDays;save();render();notify('Regras da agenda salvas.')}function saveBooking(e){e.preventDefault();let f=new FormData(e.target),date=String(f.get('date')||''),capacity=+f.get('capacity'),leadDays=+f.get('leadDays');if(!Number.isInteger(capacity)||capacity<1||!Number.isInteger(leadDays)||leadDays<0||!date||date<todayISO())return notify('Revise os dados da agenda.');db.booking.capacity=capacity;db.booking.leadDays=leadDays;if(!db.booking.dates.includes(date))db.booking.dates.push(date);save();render();notify('Data liberada para agendamentos.')}

function approveQuoteStore(e,id){e.preventDefault();let q=db.quotes.find(q=>q.id===id);if(!q||!['Solicitado','Aguardando cliente'].includes(q.status))return;let f=new FormData(e.target),date=String(f.get('date')||''),subtotal=+f.get('subtotal'),fee=+f.get('fee');if(!Number.isFinite(subtotal)||subtotal<0||!Number.isFinite(fee)||fee<0||!quoteDateOpen(date,id))return notify('Valor ou data inválidos. Confira a disponibilidade.');q.subtotal=subtotal;q.fee=fee;q.date=date;q.revision++;q.storeApproved=true;q.customerApproved=false;q.status='Aguardando cliente';quoteHistory(q,'Loja aprovou proposta revisão '+q.revision+' · '+money(quoteTotal(q))+' · '+date);save();render();notify('Proposta aprovada. Aguarda aceite do cliente.')}

enda<select name="priceBasis" onchange="productPricePreview()"><option value="unit" ${priceBasis(p)==='unit'?'selected':''}>Por unidade</option><option value="cento" ${priceBasis(p)==='cento'?'selected':''}>Por cento (100 unidades)</option></select></label><label class="field">Preço de venda (R$)<input type="number" name="price" min="0.01" step="0.01" required value="${priceBasis(p)==='cento'?(p.price*100).toFixed(2):p.price}"></label><label class="field">Custo unitário (R$)<input type="number" name="cost" min="0" step="0.01" required value="${p.cost}"></label></div><div class="two"><label class="field">Estoque<input type="number" name="stock" min="0" step="1" required value="${p.stock}"></label><label class="field">Emoji / ícone<input name="emoji" maxlength="8" value="${esc(p.emoji)}"></label></div><div class="two"><label class="field">Quantidade mínima<input type="number" name="minQty" min="1" step="1" required value="${p.minQty||1}"></label><label class="field">Incremento de compra<input type="number" name="qtyStep" min="1" step="1" required value="${p.qtyStep||1}"></label></div><p class="muted tiny">Exemplo: mínimo 50 e incremento 25 permite 50, 75, 100, 125...</p><div id="productPricePreview" class="note">Preço unitário: ${money(p.price)} · ${(p.minQty||1)} unidades: ${money(p.price*(p.minQty||1))}</div><label class="field">Imagem do doce (JPG, PNG ou WebP, até 1 MB)<input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" onchange="previewProductImage(this)"><small>Até 1 MB por imagem. Confira a prévia antes de salvar.</small></label><label class="field">URL de imagem (opcional)<input name="imageUrl" type="url" value="${esc(p.image?.startsWith('data:')?'':p.image||'')}" placeholder="https://..." oninput="previewProductUrl(this)"></label><div class="product-image-preview"><img id="productImagePreview" alt="Pré-visualização da foto do doce" src="${esc(p.image||'')}" style="${p.image?'':'display:none;'}"><div id="productImagePlaceholder" style= iv class="stock-thumb">${p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':esc(p.emoji)}</div><div class="stock-detail"><strong>${esc(p.name)}</strong><small>${p.stock<=5?'⚠️ Estoque baixo':'Unidades disponíveis'}</small><div class="stock-editor"><button type="button" class="stock-step" aria-label="Diminuir estoque" onclick="stepStockDraft(${p.id},-1)">−</button><input id="stockInput_${p.id}" aria-label="Novo estoque de ${esc(p.name)}" type="number" inputmode="numeric" min="0" max="999999999" step="1" value="${p.stock}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveStockValue(${p.id})}"><button type="button" class="stock-step" aria-label="Aumentar estoque" onclick="stepStockDraft(${p.id},1)">+</button><button type="button" class="stock-save" aria-label="Salvar novo estoque" title="Salvar estoque" onclick="saveStockValue(${p.id})">✓</button></div></div></div>`).join('')}</div><p class="muted tiny">Digite o saldo total disponível e toque em ✓ para salvar. Os botões + e − alteram o valor no campo, sem salvar automaticamente. O estoque é de produtos finais, não de ingredientes.</p>`}
function stepStockDraft(id,delta){let el=document.getElementById('stockInput_'+id);if(!el)return;let n=Number(el.value);if(!Number.isFinite(n))n=0;el.value=Math.max(0,Math.floor(n)+delta);el.classList.add('stock-dirty')}

function pantryBalance(i){return +(+i.qty||0).toFixed(3)}
function ingredientCost(i){return i.qty>0?(+i.stockValue||0)/i.qty:(+i.lastUnitCost||(+i.price||0)/(+i.packQty||1))}
function pantryMoney(v){return money(v)}
function ensurePantryMigration(){db.pantry=db.pantry||[];db.pantryEntries=db.pantryEntries||[];db.pantryMovements=db.pantryMovements||[];db.pantryLots=db.pantryLots||[];db.pantry.forEach(i=>{if(i.trackExpiry===undefined)i.trackExpiry=false;if(i.stockValue===undefined){i.stockValue=(+i.qty||0)*((+i.price||0)/(+i.packQty||1));i.lastUnitCost=(+i.price||0)/(+i.packQty||1);i.initialMigrated=true}if(!i.packQty||i.packQty<=0)i.packQty=1})}
ensurePantryMigration();
function recipeCost(rec){return (rec.ingredients||[]).reduce((sum,line)=>{let i=db.pantry.find(x=>x.id===line.id);return sum+(i?ingredientCost(i)*line.qty:0)},0)}
function recipeNeeds(rec,batches){return (rec.ingredients||[]).map(line=>{let i=db.pantry.find(x=>x.id===line.id);return i?{item:i,qty:line.qty*batches,short:Math.max(0,line.qty*batches-availableForProduction(i))}:null}).filter(Boolean)}
function adminPantry(){let low=db.pantry.filter(i=>i.qty<=i.min),expired=db.pantryLots.filter(l=>l.qty>0&&l.expiry&&l.expiry<todayISO()),soon=db.pantryLots.filter(l=>l.qty>0&&l.expiry&&l.expiry>=todayISO()&&daysUntil(l.expiry)<=7);return `<div class="section"><h2>🥣 Despensa</h2></div><div class="panel"><div class="row"><button class="btn primary" onclick="editIngredient()">＋ Cadastrar ingrediente</button><button class="btn" onclick="stockEntry()">📥 Entrada de estoque</button></div><p class="muted tiny">Cadastre cada ingrediente uma vez. Registre compras separadamente, com quantidade e preço reais. As receitas utilizam o custo médio ponderado disponível.</p></div>${low.length?'<div class="note">⚠️ '+low.length+' ingrediente(s) com estoque baixo: '+low.map(i=>esc(i.name)).join(', ')+'</div>':''}${expired.length?'<div class="note">🚫 '+expired.length+' lote(s) vencido(s): '+expired.map(l=>esc(db.pantry.find(i=>i.id===l.ingredientId)?.name||'Ingrediente')+' ('+esc(l.expiry)+')').join(', ')+'</div>':''}${soon.length?'<div class="note">⏰ '+soon.length+' lote(s) vencendo em até 7 dias.</div>':''}${db.pantry.length?db.pantry.map(i=>`<div class="panel"><div class="row"><div><b>${esc(i.name)}</b><p class="muted tiny">Cadastro permanente · ${esc(i.unit)} · ${i.packQty} ${esc(i.unit)} por embalagem</p></div><button class="btn" onclick="editIngredient(${i.id})">Editar</button></div><div class="row"><span>Saldo: <b>${pantryBalance(i)} ${esc(i.unit)}</b></span><span>Custo médio: <b>${pantryMoney(ingredientCost(i))}/${esc(i.unit)}</b></span></div><div class="row"><span>Valor em estoque: ${pantryMoney(i.stockValue||0)}</span><span>${i.qty<=i.min?'⚠️ Repor':'✓ Adequado'}</span><span>${i.trackExpiry?'📅 Validade controlada':'Validade não controlada'}</span></div><button class="btn" onclick="stockEntry(${i.id})">＋ Registrar compra</button>${i.trackExpiry?db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0).map(l=>`<p class="muted tiny">Lote ${esc(l.code)} · ${l.qty} ${esc(i.unit)} · validade ${esc(l.expiry||'não informada')} ${l.expiry&&l.expiry<todayISO()?'🚫 VENCIDO':l.expiry&&daysUntil(l.expiry)<=7?'⏰ Vence em breve':''}</p>`).join(''):''}</div>`).join(''):'<div class="panel">Cadastre o primeiro ingrediente para começar a controlar suas compras.</div>'}<div class="section"><h3>🧾 Últimas movimentações</h3></div>${db.pantryMovements.slice(-12).reverse().map(m=>`<div class="panel"><div class="row"><b>${esc(m.name)}</b><span>${new Date(m.at).toLocaleDateString('pt-BR')}</span></div><p class="muted">${esc(m.kind)} · ${m.qty} ${esc(m.unit)} · ${pantryMoney(m.total||0)}</p></div>`).join('')||'<div class="panel">Nenhuma movimentação registrada.</div>'}`;}
function editIngredient(id){let i=db.pantry.find(x=>x.id===id)||{name:'',unit:'un',qty:0,min:0,packQty:1};showModal(`<h2>${id?'Editar ingrediente':'Cadastrar ingrediente'}</h2><p class="muted">Este é um cadastro reutilizável. Quantidades e valores de compras são informados em Entrada de estoque.</p><form class="stack" onsubmit="saveIngredient(event,${id||0})"><label class="field">Nome<input name="name" required maxlength="100" value="${esc(i.name)}"></label><label class="field">Unidade de controle<select name="unit">${['un','g','ml'].map(u=>`<option value="${u}" ${u===i.unit?'selected':''}>${u==='un'?'Unidade (un)':u==='g'?'Gramas (g)':'Mililitros (ml)'}</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade por embalagem<input type="number" name="packQty" min=".001" step=".001" required value="${i.packQty}"></label><label class="field">Estoque mínimo<input type="number" name="min" min="0" step=".001" required value="${i.min}"></label></div><label class="field"><input type="checkbox" name="trackExpiry" ${i.trackExpiry?'checked':''}> Controlar validade deste ingrediente</label><div class="note">Se marcado, cada nova entrada exigirá uma data de validade e a produção consumirá primeiro os lotes que vencem antes. Se desmarcado, o sistema não exige nem controla validade. Exemplo: creme de leite comprado por unidade: unidade = un e quantidade por embalagem = 1. Leite condensado em lata: un e 1. Chocolate a granel: g e 1000 para pacote de 1 kg.</div><button class="btn primary full">Salvar cadastro</button></form>`)}
function saveIngredient(e,id){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),unit=String(f.get('unit')),packQty=+f.get('packQty'),min=+f.get('min'),trackExpiry=f.has('trackExpiry');if(!name||packQty<=0||min<0)return notify('Revise os dados.');if(db.pantry.some(i=>i.id!==id&&i.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))return notify('Este ingrediente já está cadastrado. Use Entrada de estoque.');let at=db.pantry.findIndex(x=>x.id===id);if(at>=0){let old=db.pantry[at];if(old.qty>0&&old.unit!==unit)return notify('Não altere a unidade de um ingrediente com estoque. Consuma ou ajuste o saldo antes.');Object.assign(old,{name,unit,packQty,min,trackExpiry})}else db.pantry.push({id:Date.now(),name,unit,packQty,min,trackExpiry,qty:0,stockValue:0,lastUnitCost:0});save();closeModal();render()}
function stockEntry(id){if(!db.pantry.length)return notify('Cadastre um ingrediente primeiro.');let selected=db.pantry.find(i=>i.id===id)||db.pantry[0];showModal(`<h2>📥 Entrada de estoque</h2><p class="muted">Selecione o ingrediente já cadastrado e informe a quantidade de embalagens compradas e o preço total da compra.</p><form class="stack" onsubmit="saveStockEntry(event)"><label class="field">Ingrediente<select name="id" id="entryIngredient" onchange="updateEntryPreview()">${db.pantry.map(i=>`<option value="${i.id}" ${i.id===selected.id?'selected':''}>${esc(i.name)} · ${i.packQty} ${esc(i.unit)}/embalagem</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade de embalagens<input id="entryPacks" name="packs" type="number" min=".001" step=".001" required value="1" oninput="updateEntryPreview()"></label><label class="field">Preço TOTAL pago (R$)<input id="entryTotal" name="total" type="number" min="0" step=".01" required placeholder="Ex.: 12,00" oninput="updateEntryPreview()"></label></div><div id="expiryFields"></div><div class="note" id="entryPreview">Informe a quantidade e o preço para calcular o custo.</div><button class="btn primary full">Confirmar entrada de estoque</button></form>`);updateEntryPreview()}
function updateEntryPreview(){let el=document.getElementById('entryPreview'),i=db.pantry.find(x=>x.id===+document.getElementById('entryIngredient')?.value),packs=+document.getElementById('entryPacks')?.value,total=+document.getElementById('entryTotal')?.value;let expiryArea=document.getElementById('expiryFields');if(expiryArea&&i)expiryArea.innerHTML=i.trackExpiry?'<div class="two"><label class="field">Código do lote<input name="lotCode" maxlength="40" placeholder="Ex.: LOTE-01"></label><label class="field">Validade do lote<input name="expiry" type="date" required min="'+todayISO()+'"></label></div><p class="muted tiny">A validade é obrigatória apenas para ingredientes com controle ativado.</p>':'';if(el&&i&&packs>0)el.textContent='Entrada: '+(packs*i.packQty).toFixed(3)+' '+i.unit+' · Custo desta compra: '+money(total/(packs*i.packQty))+'/'+i.unit+' · Saldo após entrada: '+(i.qty+packs*i.packQty).toFixed(3)+' '+i.unit}
function saveStockEntry(e){e.preventDefault();let f=new FormData(e.target),i=db.pantry.find(x=>x.id===+f.get('id')),packs=+f.get('packs'),total=+f.get('total');if(!i||packs<=0||!Number.isFinite(total)||total<0)return notify('Revise a entrada.');let expiry=String(f.get('expiry')||''),lotCode=String(f.get('lotCode')||'').trim();if(i.trackExpiry&&(!/^\\d{4}-\\d{2}-\\d{2}$/.test(expiry)||expiry<todayISO()))return notify('Informe uma validade válida e não vencida.');let qty=+(packs*i.packQty).toFixed(3),unitCost=total/qty;i.qty=+(i.qty+qty).toFixed(3);i.stockValue=+(i.stockValue+total).toFixed(4);i.lastUnitCost=unitCost;db.pantryLots.push({id:Date.now()+Math.random(),ingredientId:i.id,code:lotCode||'LOTE-'+Date.now(),expiry:i.trackExpiry?expiry:null,qty,unitCost,at:Date.now()});db.pantryMovements.push({at:Date.now(),kind:'Entrada',id:i.id,name:i.name,unit:i.unit,qty,total,packs,unitCost});save();closeModal();render();notify('Compra registrada. Estoque e custo médio atualizados.')}
function todayISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(date){let now=new Date(todayISO()+'T12:00:00'),target=new Date(date+'T12:00:00');return Math.round((target-now)/86400000)}
function availableForProduction(i){if(!i.trackExpiry)return i.qty;let lots=db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0);let accounted=lots.reduce((s,l)=>s+l.qty,0);let legacy=Math.max(0,i.qty-accounted);return legacy+lots.filter(l=>!l.expiry||l.expiry>=todayISO()).reduce((s,l)=>s+l.qty,0)}
function consumeLots(i,qty){let remaining=qty;let lots=db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0&&(!i.trackExpiry||!l.expiry||l.expiry>=todayISO())).sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31')||a.at-b.at);for(let l of lots){let taken=Math.min(remaining,l.qty);l.qty=+(l.qty-taken).toFixed(3);remaining=+(remaining-taken).toFixed(3);if(remaining<=0)break}return remaining}
function adminPlanner(){let pending=db.orders.filter(o=>!['Cancelado','Concluído','Entregue'].includes(o.status));let demand={};pending.forEach(o=>(o.items||[]).forEach(i=>demand[i.id]=(demand[i.id]||0)+i.qty));let needs=[],alerts=[];let cards=db.recipes.map(rec=>{let prod=db.products.find(x=>x.id===rec.product),qty=demand[rec.product]||0,yieldQty=Math.max(1,rec.yieldQty),batches=Math.ceil(Math.max(0,qty-(prod?.stock||0))/yieldQty),cost=recipeCost(rec),short=recipeNeeds(rec,batches).filter(x=>x.short>0);short.forEach(x=>alerts.push({name:x.item.name,qty:x.short,unit:x.item.unit}));needs.push({rec,qty,batches,cost,short});return `<div class="panel"><div class="row"><b>${esc(prod?.name||'Produto excluído')}</b><button class="btn" onclick="editRecipe(${rec.id})">Ficha técnica</button></div><p>Rendimento: <b>${yieldQty} unidades/receita</b> · Custo da receita: <b>${money(cost)}</b> · Custo unitário: <b>${money(cost/yieldQty)}</b></p><p>Pedidos abertos: ${qty} · Estoque pronto: ${prod?.stock||0} · <b>Produzir: ${batches} receita(s)</b></p>${short.length?'<div class="note">⚠️ Falta para produzir: '+short.map(x=>esc(x.item.name)+' ('+x.short.toFixed(2)+' '+esc(x.item.unit)+')').join(', ')+'</div>':'<p class="muted">✓ Ingredientes suficientes para esta previsão, sujeitos ao consumo por outras receitas.</p>'}<button class="btn primary" onclick="produce(${rec.id},${batches})" ${!batches||short.length?'disabled':''}>Registrar produção de ${batches} receita(s)</button></div>`}).join('');let combined=new Map();needs.forEach(n=>recipeNeeds(n.rec,n.batches).forEach(x=>{let cur=combined.get(x.item.id)||{item:x.item,qty:0};cur.qty+=x.qty;combined.set(x.item.id,cur)}));let shopping=[...combined.values()].filter(x=>x.qty>x.item.qty);let boxes=[4,6,10].map(n=>{let ps=db.products.filter(p=>p.active&&p.stock>=n),best=ps.map(p=>({p,margin:n*p.price-n*(db.recipes.find(r=>r.product===p.id)?recipeCost(db.recipes.find(r=>r.product===p.id))/db.recipes.find(r=>r.product===p.id).yieldQty:p.cost)})).sort((a,b)=>b.margin-a.margin)[0];return `<div class="panel"><b>📦 Caixa de ${n} unidades</b><p class="muted">Comparação indicativa usando doces disponíveis. Cadastre uma caixa como produto para vender com preço próprio.</p><p>${best?'Exemplo com '+esc(best.p.name)+' · margem bruta avulsa equivalente: '+money(best.margin):'Sem quantidade pronta suficiente para simular.'}</p></div>`}).join('');return `<div class="section"><h2>🧠 Planejamento inteligente</h2><button class="btn primary" onclick="editRecipe()">＋ Ficha técnica</button></div><div class="note">Previsão baseada nos pedidos registrados neste navegador, no estoque pronto e no rendimento informado. Não substitui controle integrado de produção.</div><div class="section"><h3>🛒 Alertas de compra</h3></div>${shopping.length?shopping.map(x=>`<div class="note">⚠️ ${esc(x.item.name)}: faltam ${(x.qty-x.item.qty).toFixed(2)} ${esc(x.item.unit)} para atender à produção planejada.</div>`).join(''):'<div class="panel">Nenhuma falta identificada para os pedidos abertos.</div>'}<div class="section"><h3>🍬 Receitas e demanda</h3></div>${cards||'<div class="panel">Cadastre fichas técnicas para calcular ingredientes, custos e produção.</div>'}<div class="section"><h3>📦 Aproveitamento de excedentes</h3></div>${boxes}<div class="panel"><h3>Destino das sobras</h3><form class="stack" onsubmit="allocateLeftovers(event)"><label class="field">Produto<select name="product">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} disponíveis)</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade<input name="qty" type="number" min="1" step="1" required></label><label class="field">Destino<select name="reason"><option>Descarte</option><option>Cortesia</option><option>Reservar caixa 4</option><option>Reservar caixa 6</option><option>Reservar caixa 10</option></select></label></div><button class="btn primary full">Registrar destinação</button></form><p class="muted tiny">Ao reservar para caixas, as unidades saem do estoque avulso para evitar venda duplicada. A caixa final ainda precisa ser registrada como produto separado.</p></div>${db.allocations.slice(-6).reverse().map(a=>`<p class="muted tiny">${new Date(a.at).toLocaleString('pt-BR')} · ${esc(a.product)} · ${a.qty} un · ${esc(a.reason)}</p>`).join('')}`;}
function editRecipe(id){let r=db.recipes.find(x=>x.id===id)||{product:db.products[0]?.id,yieldQty:20,ingredients:[]};showModal(`<h2>Ficha técnica da receita</h2><form class="stack" onsubmit="saveRecipe(event,${id||0})"><label class="field">Produto final<select name="product">${db.products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Rendimento em unidades<input type="number" name="yieldQty" min="1" step="1" required value="${r.yieldQty}"></label><p class="muted">Informe quanto de cada ingrediente é usado para UMA receita completa.</p>${db.pantry.map(i=>`<label class="field">${esc(i.name)} (${esc(i.unit)})<input type="number" name="ing_${i.id}" min="0" step=".001" value="${r.ingredients.find(x=>x.id===i.id)?.qty||0}"></label>`).join('')||'<div class="note">Cadastre ingredientes na Despensa antes de montar a receita.</div>'}<button class="btn primary full">Salvar ficha técnica</button></form>`)}
function saveRecipe(e,id){e.preventDefault();let f=new FormData(e.target),product=+f.get('product'),yieldQty=+f.get('yieldQty'),ingredients=db.pantry.map(i=>({id:i.id,qty:+f.get('ing_'+i.id)||0})).filter(x=>x.qty>0);if(!product||yieldQty<1)return notify('Revise rendimento e produto.');let recipe={id:id||Date.now(),product,yieldQty,ingredients},at=db.recipes.findIndex(r=>r.id===id);if(at>=0)db.recipes[at]=recipe;else db.recipes.push(recipe);save();closeModal();render()}
function produce(id,batches){let r=db.recipes.find(x=>x.id===id),p=db.products.find(x=>x.id===r?.product);if(!r||!p||batches<1)return;let req=recipeNeeds(r,batches);if(req.some(x=>x.short>0))return notify('Ingredientes insuficientes ou com validade vencida.');if(!confirm('Registrar produção de '+batches+' receita(s), consumindo ingredientes da despensa e adicionando '+(r.yieldQty*batches)+' unidades ao estoque?'))return;req.forEach(x=>{consumeLots(x.item,x.qty);let unitCost=ingredientCost(x.item),consumed=+(unitCost*x.qty).toFixed(4);x.item.qty=+(x.item.qty-x.qty).toFixed(3);x.item.stockValue=Math.max(0,+(x.item.stockValue-consumed).toFixed(4));if(x.item.qty===0)x.item.stockValue=0;db.pantryMovements.push({at:Date.now(),kind:'Consumo na produção',id:x.item.id,name:x.item.name,unit:x.item.unit,qty:-x.qty,total:-consumed})});p.stock+=r.yieldQty*batches;db.production.push({at:Date.now(),product:p.id,batches,units:r.yieldQty*batches,cost:recipeCost(r)*batches});save();render()}
function allocateLeftovers(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===+f.get('product')),qty=+f.get('qty'),reason=String(f.get('reason'));if(!p||qty<1||qty>p.stock)return notify('Quantidade indisponível.');let size=+(reason.match(/\d+/)?.[0]||0);if(size&&qty%size!==0)return notify('Para caixas, use múltiplos de '+size+' unidades.');if(!confirm('Destinar '+qty+' unidades para '+reason+'?'))return;p.stock-=qty;db.allocations.push({at:Date.now(),product:p.name,qty,reason});save();render()}

function loyaltyKey(phone){return String(phone||'').replace(/\D/g,'')}
function loyaltyAccount(phone){let key=loyaltyKey(phone);if(!key)return null;return db.loyaltyAccounts[key]||(db.loyaltyAccounts[key]={phone:key,spend:0,earned:0,awarded:0,creditedOrders:[]})}
function creditLoyalty(order){if(!db.loyalty.enabled||order.loyaltyCredited)return;let a=loyaltyAccount(order.phone);if(!a)return;let threshold=Math.max(1,+db.loyalty.threshold||100);a.spend=+(a.spend+(+order.subtotal||0)).toFixed(2);a.earned=Math.floor((a.spend+0.00001)/threshold);a.creditedOrders.push(order.id);order.loyaltyCredited=true;order.loyaltyEarnedAt=new Date().toISOString()}
function loyaltyProgress(a){let required=Math.max(1,+db.loyalty.stamps||10);return {required,filled:a?a.earned%required:0,completed:a?Math.floor(a.earned/required):0}}
function voucherExpiry(days){let d=new Date();d.setDate(d.getDate()+Math.max(1,+days||30));return d.toISOString().slice(0,10)}
function validVoucher(code,phone){let v=db.loyaltyVouchers.find(v=>v.code===code&&v.phone===loyaltyKey(phone));return v&&v.status==='disponivel'&&v.expires>=new Date().toISOString().slice(0,10)?v:null}
function showLoyaltyBack(){document.getElementById('loyaltyCard')?.classList.toggle('flipped')}
function renderLoyalty(){let a=loyaltyAccount(db.customer.phone),l=db.loyalty,p=loyaltyProgress(a),eligible=a?Math.max(0,p.completed-a.awarded):0;let vouchers=db.loyaltyVouchers.filter(v=>v.phone===loyaltyKey(db.customer.phone));return '<div class="section"><h2>🎟️ Meu cartão fidelidade</h2></div><div class="note">Programa demonstrativo neste aparelho. Informe seu WhatsApp em Minha conta para identificar seu cartão.</div>'+(!a?'<div class="panel"><button class="btn primary full" onclick="navigate(\'profile\')">Cadastrar meus dados</button></div>':'<div class="loyalty-scene"><div class="loyalty-card" id="loyaltyCard"><div class="loyalty-front"><div class="loyalty-overline">DOCE ATELIÊ · CLUBE DE CARINHO</div><h2>Seu doce merece prêmio ♡</h2><p>'+esc(db.customer.name||'Cliente especial')+'</p><div class="stamp-grid">'+Array.from({length:p.required},(_,i)=>'<div class="stamp '+(i<p.filled?'filled':'')+'">'+(i<p.filled?'🍫':'♡')+'</div>').join('')+'</div><p class="loyalty-progress">'+p.filled+' de '+p.required+' carimbos · '+money(l.threshold)+' por carimbo</p><button class="loyalty-flip" onclick="showLoyaltyBack()">↻ Ver regras no verso</button></div><div class="loyalty-back"><h2>Como ganhar seu prêmio</h2><p>'+esc(l.rules)+'</p><p><b>Prêmio:</b> '+esc(l.prize)+'</p><p><b>Validade do voucher:</b> '+l.validDays+' dias após emissão.</p><button class="loyalty-flip" onclick="showLoyaltyBack()">↻ Voltar aos carimbos</button></div></div></div><div class="panel"><h3>Seu progresso</h3><p>Compras entregues contabilizadas: <b>'+money(a.spend)+'</b></p><p>Carimbos acumulados: <b>'+a.earned+'</b> · Cartões completos: <b>'+p.completed+'</b></p>'+(eligible?'<div class="note">🎉 Você completou '+eligible+' cartão(ões)! Solicite seu voucher.</div><button class="btn primary full" onclick="requestLoyaltyVoucher()">Resgatar prêmio</button>':'<p class="muted">Continue comprando para completar o cartão.</p>')+'</div><div class="section"><h3>Meus vouchers</h3></div>'+ (vouchers.length?vouchers.slice().reverse().map(v=>'<div class="panel"><b>'+esc(v.code)+'</b><p>'+esc(v.prize)+'</p><p class="muted tiny">Validade: '+esc(v.expires)+' · '+esc(v.status)+'</p><button class="btn" onclick="copyVoucher(\''+esc(v.code)+'\')">Copiar código</button></div>').join(''):'<div class="panel">Seus vouchers aparecerão aqui.</div>'))}
function copyVoucher(code){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(()=>notify('Código copiado.')).catch(()=>notify(code));else notify(code)}
function requestLoyaltyVoucher(){let a=loyaltyAccount(db.customer.phone),p=loyaltyProgress(a);if(!a||p.completed<=a.awarded)return notify('Ainda não há cartão completo para resgatar.');showModal('<h2>🎁 Seu prêmio chegou!</h2><p>Informe o e-mail que deseja associar ao voucher. Ele será exibido aqui para você copiar e usar na próxima compra.</p><form class="stack" onsubmit="issueLoyaltyVoucher(event)"><label class="field">E-mail do voucher<input type="email" name="email" maxlength="120" autocomplete="email" required placeholder="voce@exemplo.com"></label><button class="btn primary full">Gerar meu voucher</button></form><p class="muted tiny">Demonstração: o sistema não envia e-mails automaticamente.</p>')}
function issueLoyaltyVoucher(e){e.preventDefault();let a=loyaltyAccount(db.customer.phone),p=loyaltyProgress(a);if(!a||p.completed<=a.awarded)return notify('Não há prêmio disponível.');let email=String(new FormData(e.target).get('email')||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify('Informe um e-mail válido.');let code='DOCE-'+Math.random().toString(36).slice(2,10).toUpperCase();while(db.loyaltyVouchers.some(v=>v.code===code))code='DOCE-'+Math.random().toString(36).slice(2,10).toUpperCase();db.loyaltyVouchers.push({code,phone:a.phone,email,prize:db.loyalty.prize,issued:new Date().toISOString(),expires:voucherExpiry(db.loyalty.validDays),status:'disponivel',orderId:null});a.awarded++;save();closeModal();render();notify('Voucher '+code+' criado. Copie o código para sua próxima compra. O envio automático por e-mail ainda não está disponível.')}
function redeemVoucher(orderId){let o=db.orders.find(x=>x.id===orderId),v=db.loyaltyVouchers.find(x=>x.code===o?.voucherCode&&x.orderId===orderId);if(!o||!v||v.status!=='reservado')return notify('Voucher não reservado para este pedido.');if(v.expires<new Date().toISOString().slice(0,10))return notify('Voucher vencido.');if(!confirm('Confirma que o brinde foi entregue ao cliente?'))return;v.status='utilizado';v.usedAt=new Date().toISOString();save();render()}
function adminBonuses(){let l=db.loyalty;return '<div class="section"><h2>🎁 Bonificações e fidelidade</h2></div><div class="panel"><form class="stack" onsubmit="saveBonuses(event)"><label><input type="checkbox" name="enabled" '+(l.enabled?'checked':'')+'> Programa de fidelidade ativo</label><div class="two"><label class="field">Valor por carimbo (R$)<input type="number" name="threshold" min=".01" step=".01" required value="'+l.threshold+'"></label><label class="field">Carimbos para completar<input type="number" name="stamps" min="1" max="30" step="1" required value="'+l.stamps+'"></label></div><label class="field">Prêmio ao completar<input name="prize" required maxlength="140" value="'+esc(l.prize)+'"></label><label class="field">Validade do voucher (dias)<input type="number" name="validDays" min="1" max="365" step="1" required value="'+l.validDays+'"></label><label class="field">Regras exibidas no verso do cartão<textarea name="rules" rows="6" required>'+esc(l.rules)+'</textarea></label><button class="btn primary full">Salvar bonificações</button></form></div><div class="panel"><h3>Validação dos vouchers</h3><p class="muted">Ao finalizar uma nova compra, o cliente informa o código. A loja deve verificar o pedido e confirmar a entrega do brinde na área Entregas. Códigos utilizados não podem ser usados novamente.</p><p class="muted tiny">Atenção: esta demonstração usa armazenamento local. Para impedir fraude e sincronizar entre aparelhos, a validação deverá ocorrer no servidor.</p></div>'}
function saveBonuses(e){e.preventDefault();let f=new FormData(e.target),threshold=+f.get('threshold'),stamps=+f.get('stamps'),validDays=+f.get('validDays');if(!Number.isFinite(threshold)||threshold<=0||!Number.isInteger(stamps)||stamps<1||stamps>30||!Number.isInteger(validDays)||validDays<1)return notify('Confira os valores.');db.loyalty={enabled:f.has('enabled'),threshold,stamps,validDays,prize:String(f.get('prize')||'').trim(),rules:String(f.get('rules')||'').trim()};save();render();notify('Bonificações atualizadas.')}

let brandingTimer=null,brandingSlide=0;
function updateStoreFavicon(){let icon=db.branding.icon||db.branding.logo;if(!icon)return;let link=document.getElementById('store-favicon');if(!link){link=document.createElement('link');link.id='store-favicon';link.rel='icon';document.head.appendChild(link)}link.href=icon}
function renderBrandHero(){let b=db.branding,slides=(b.slides||[]).filter(s=>s.image);return '<section class="brand-hero" style="--banner:'+esc(b.bannerColor||'#9f4769')+';--banner-text:'+esc(b.bannerTextColor||'#ffffff')+'"><div class="brand-copy"><span class="brand-tag">'+esc(b.bannerTag||'')+'</span><h1>'+esc(b.bannerTitle||'')+'</h1><p>'+esc(b.bannerSubtitle||'')+'</p></div>'+(slides.length?'<div class="brand-carousel"><img id="brandCarouselImage" src="'+esc(slides[0].image)+'" alt="'+esc(slides[0].alt||'Imagem da marca')+'"><div class="brand-carousel-dots">'+slides.map((s,i)=>'<button aria-label="Mostrar banner '+(i+1)+'" class="'+(i===0?'on':'')+'" onclick="showBrandSlide('+i+')"></button>').join('')+'</div></div>':'<div class="brand-emoji">'+esc(b.bannerEmoji||'🧁')+'</div>')+'</section>'}
function showBrandSlide(index){let slides=(db.branding.slides||[]).filter(s=>s.image);if(!slides.length)return;brandingSlide=(index+slides.length)%slides.length;let image=document.getElementById('brandCarouselImage');if(!image)return;image.src=slides[brandingSlide].image;image.alt=slides[brandingSlide].alt||'Imagem da marca';document.querySelectorAll('.brand-carousel-dots button').forEach((b,i)=>b.classList.toggle('on',i===brandingSlide))}
function scheduleBrandCarousel(){if(brandingTimer){clearInterval(brandingTimer);brandingTimer=null}let slides=(db.branding.slides||[]).filter(s=>s.image);if(!admin&&page==='home'&&slides.length>1){brandingSlide=0;brandingTimer=setInterval(()=>{if(document.getElementById('brandCarouselImage'))showBrandSlide(brandingSlide+1)},Math.max(3,Math.min(15,+db.branding.carouselSeconds||5))*1000)}}
function brandingPreviewImage(input,kind){let f=input.files?.[0];if(!f)return;let max=1024*1024;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>max){input.value='';notify('Escolha JPG, PNG ou WebP com até '+(max/1024/1024)+' MB.');return}let reader=new FileReader();reader.onload=()=>{let img=document.getElementById('brandPreview_'+kind);if(img){img.src=reader.result;img.hidden=false}};reader.readAsDataURL(f)}
async function brandingReadImage(file,max){if(!file||!file.size)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>max)throw Error('Imagem inválida ou maior que o limite permitido.');return await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Falha ao ler imagem'));reader.readAsDataURL(file)})}
function adminBranding(){let b=db.branding;return '<div class="section"><h2>🎨 Identidade da loja</h2></div><div class="note">Personalize a página do cliente. As alterações ficam neste navegador nesta versão demonstrativa. Fotos grandes podem ultrapassar o limite do armazenamento local.</div><div class="panel"><h3>Prévia da página</h3>'+renderBrandHero()+'</div><div class="panel"><form class="stack" onsubmit="saveBranding(event)"><label class="field">Texto de destaque do banner<input name="bannerTitle" required maxlength="100" value="'+esc(b.bannerTitle)+'"></label><label class="field">Subtítulo do banner<textarea name="bannerSubtitle" maxlength="250">'+esc(b.bannerSubtitle)+'</textarea></label><label class="field">Etiqueta acima do título<input name="bannerTag" maxlength="65" value="'+esc(b.bannerTag)+'"></label><label class="field">Emoji quando não houver fotos<input name="bannerEmoji" maxlength="8" value="'+esc(b.bannerEmoji)+'"></label><div class="two"><label class="field">Cor do banner<input type="color" name="bannerColor" value="'+esc(b.bannerColor)+'"></label><label class="field">Cor do texto<input type="color" name="bannerTextColor" value="'+esc(b.bannerTextColor)+'"></label></div><label class="field">Cor dos ícones e botões<input type="color" name="iconColor" value="'+esc(db.settings.color||'#a84e6e')+'"></label><label class="field">Fundo da página<input type="color" name="backgroundColor" value="'+esc(b.backgroundColor)+'"></label><label class="field">Logotipo da loja (até 1 MB)<input type="file" name="logo" accept="image/png,image/jpeg,image/webp" onchange="brandingPreviewImage(this,\'logo\')"></label><img id="brandPreview_logo" class="brand-preview" '+(b.logo?'src="'+esc(b.logo)+'"':'hidden')+' alt="Prévia do logotipo"><label class="field">Ícone do aplicativo (até 1 MB)<input type="file" name="icon" accept="image/png,image/jpeg,image/webp" onchange="brandingPreviewImage(this,\'icon\')"></label><img id="brandPreview_icon" class="brand-preview" '+(b.icon?'src="'+esc(b.icon)+'"':'hidden')+' alt="Prévia do ícone"><div class="section"><h3>Carrossel da marca</h3></div><p class="muted">Até 3 imagens JPG, PNG ou WebP de 1 MB cada, com prévia antes de salvar. Para melhor desempenho, prefira fotos menores.</p>'+[0,1,2].map(i=>'<div class="brand-slide-edit"><label class="field">Imagem '+(i+1)+'<input type="file" name="slide'+i+'" accept="image/png,image/jpeg,image/webp" onchange="brandingPreviewImage(this,\'slide'+i+'\')"></label><img id="brandPreview_slide'+i+'" class="brand-preview" '+(b.slides[i]?.image?'src="'+esc(b.slides[i].image)+'"':'hidden')+' alt="Prévia do banner"><label class="field">Descrição da imagem<input name="slideAlt'+i+'" maxlength="100" value="'+esc(b.slides[i]?.alt||'')+'"></label><label><input type="checkbox" name="removeSlide'+i+'"> Remover imagem '+(i+1)+'</label></div>').join('')+'<label class="field">Trocar imagem a cada (segundos)<input type="number" name="carouselSeconds" min="3" max="15" step="1" value="'+(b.carouselSeconds||5)+'"></label><button class="btn primary full">Salvar identidade visual</button></form></div>'}
async function saveBranding(e){e.preventDefault();let f=new FormData(e.target),b=db.branding;try{let logo=await brandingReadImage(f.get('logo'),1024*1024),icon=await brandingReadImage(f.get('icon'),1024*1024);let slides=[];for(let i=0;i<3;i++){let image=await brandingReadImage(f.get('slide'+i),1024*1024),existing=b.slides[i];slides.push(f.has('removeSlide'+i)?null:{image:image||existing?.image||'',alt:String(f.get('slideAlt'+i)||'').trim()})}let next={bannerTitle:String(f.get('bannerTitle')||'').trim(),bannerSubtitle:String(f.get('bannerSubtitle')||'').trim(),bannerTag:String(f.get('bannerTag')||'').trim(),bannerEmoji:String(f.get('bannerEmoji')||'🧁').trim(),bannerColor:String(f.get('bannerColor')||'#9f4769'),bannerTextColor:String(f.get('bannerTextColor')||'#ffffff'),backgroundColor:String(f.get('backgroundColor')||'#fff9f6'),logo:logo||b.logo,icon:icon||b.icon,slides:slides.filter(Boolean),carouselSeconds:Math.max(3,Math.min(15,+f.get('carouselSeconds')||5))};let prior=db.branding,priorColor=db.settings.color;db.branding=next;db.settings.color=String(f.get('iconColor')||priorColor);try{save();setTheme(db.settings.color)}catch(err){db.branding=prior;db.settings.color=priorColor;setTheme(priorColor);throw Error('Espaço de armazenamento insuficiente. Use imagens menores ou URLs.')}render();notify('Identidade visual salva neste navegador.')}catch(err){notify(err.message||'Não foi possível salvar as imagens.')}}
function adminSettings(){return `<div class="section"><h2>Configurações</h2></div><div class="panel"><form class="stack" onsubmit="saveSettings(event)"><label class="field">Nome da loja<input name="name" maxlength="50" required value="${esc(db.settings.name)}"></label><label class="field">WhatsApp da loja (com DDI 55)<input name="whatsapp" placeholder="5541999999999" value="${esc(db.settings.whatsapp)}"></label><label class="field">Chave Pix da loja<input name="pixKey" value="${esc(db.settings.pixKey||'')}" placeholder="Chave Pix para copiar"></label><label class="field">Nome do recebedor Pix<input name="pixName" value="${esc(db.settings.pixName||'')}" placeholder="Nome exibido ao cliente"></label><div class="note">A chave Pix é pública para o cliente. A confirmação de pagamento deve ser feita no banco; integração automática exige servidor e API de pagamentos.</div><div class="two"><label class="field">Taxa de entrega (R$)<input type="number" min="0" step="0.01" name="deliveryFee" value="${db.settings.deliveryFee}"></label><label class="field">Pedido mínimo (R$)*<input type="number" min="0" step="0.01" name="minimum" value="${db.settings.minimum}"></label></div><div class="field">Paletas harmônicas (cores da marca)<div class="swatches">${['#a84e6e','#6b579a','#247d74','#b66b43','#376e9b'].map(c=>`<button type="button" class="swatch" style="background:${c}" onclick="setTheme('${c}');render()" aria-label="Tema ${c}"></button>`).join('')}</div></div><label class="field">Cor principal personalizada<input type="color" name="color" value="${esc(db.settings.color)}"></label><button class="btn primary full">Salvar configurações</button></form><p class="muted tiny">* Pedido mínimo armazenado para futura integração; não aplicado nesta demonstração.</p></div><div class="panel stack"><h3>Dados de demonstração</h3><button class="btn" onclick="exportData()">⬇️ Exportar backup JSON</button><button class="btn danger" onclick="if(confirm('Apagar todos os dados locais e restaurar o exemplo?')){localStorage.removeItem(KEY);location.reload()}">Restaurar dados de exemplo</button></div><div class="note">Sem autenticação real. Qualquer pessoa com acesso ao código pode alterar os dados locais. Para produção, use API, autenticação e autorização de papéis no servidor.</div>`}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.settings.name=String(f.get('name')).trim();db.settings.pixKey=String(f.get('pixKey')||'').trim();db.settings.pixName=String(f.get('pixName')||'').trim();db.settings.whatsapp=String(f.get('whatsapp')).replace(/\D/g,'');db.settings.deliveryFee=Math.max(0,+f.get('deliveryFee'));db.settings.minimum=Math.max(0,+f.get('minimum'));setTheme(String(f.get('color')));save();render();notify('Configurações salvas neste dispositivo')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='doce-atelie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
