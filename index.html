"brand">Doce Ateliê</span><small>DOCINHOS GOURMET</small></div><div class="headright"><button class="iconbtn" onclick="navigate('cart')" aria-label="Carrinho">🛍️ <span id="cartcount">0</span></button><button class="iconbtn" onclick="openAccess()" aria-label="Área administrativa">⚙️</button></div></div></header><main class="wrap" id="main"></main><nav class="bottom" id="nav"></nav><div id="modalhost"></div><script>
const seed=[{id:1,name:'Brigadeiro belga',cat:'Brigadeiros',desc:'Chocolate belga 54% e granulado premium',price:6.5,cost:2.35,stock:45,emoji:'🍫',active:true},{id:2,name:'Beijinho de coco',cat:'Clássicos',desc:'Coco fresco e leite condensado artesanal',price:5.5,cost:1.85,stock:32,emoji:'🥥',active:true},{id:3,name:'Morango encantado',cat:'Especiais',desc:'Morango com creme e cobertura delicada',price:9.9,cost:4.1,stock:16,emoji:'🍓',active:true},{id:4,name:'Pistache supreme',cat:'Especiais',desc:'Brigadeiro de pistache com toque crocante',price:8.5,cost:3.6,stock:21,emoji:'💚',active:true},{id:5,name:'Ninho com Nutella',cat:'Brigadeiros',desc:'Leite Ninho e recheio cremoso de avelã',price:7.5,cost:3.05,stock:38,emoji:'🍥',active:true},{id:6,name:'Caixa presente 6 un.',cat:'Presentes',desc:'Seleção especial para presentear',price:36,cost:15.5,stock:12,emoji:'🎁',active:true}];
const KEY='doce-atelier-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{products:seed,orders:[],settings:{name:'Doce Ateliê',whatsapp:'',deliveryFee:7,minimum:0,color:'#a84e6e'},nextId:7};let page='home',cat='Todos',query='',cart={},admin=false,tab='dashboard';db.customer=db.customer||{name:'',phone:'',address:'',notes:''};db.settings.pixKey=db.settings.pixKey||'';db.settings.pixName=db.settings.pixName||'';db.pantry=db.pantry||[];db.recipes=db.recipes||[];db.production=db.production||[];db.allocations=db.allocations||[];const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function setTheme(c){document.documentElement.style.setProperty('--p',c);db.settings.color=c;save()}setTheme(db.settings.color);function notify(s){alert(s)}function navigate(p){page=p;render();window.scrollTo(0,0)}function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}function render(){document.body.classList.toggle('shopping',!admin&&page==='home');document.getElementById('brand').textContent=db.settings.name;document.getElementById('cartcount').textContent=count();document.getElementById('main').innerHTML=admin?renderAdmin():page==='home'?renderHome():page==='cart'?renderCart():page==='orders'?renderOrders():page==='profile'?renderProfile():renderContact();document.getElementById('nav').innerHTML=(admin?[['dashboard','📊','Painel'],['products','🍬','Produtos'],['deliveries','🚚','Entregas'],['stock','📦','Estoque'],['pantry','🥣','Despensa'],['planner','🧠','Produção'],['settings','⚙️','Ajustes']]:[['home','🏠','Início'],['cart','🛒','Carrinho'],['orders','🧾','Pedidos'],['profile','👤','Minha conta'],['contact','💬','Contato']]).map(([id,ic,label])=>`<button class="${(admin?tab:page)===id?'on':''}" onclick="${admin?`tab='${id}';render()`:`navigate('${id}')`}"><b>${ic}</b> function renderHome(){const categories=['Todos',...new Set(db.products.filter(p=>p.active).map(p=>p.cat))];let prods=db.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase())));return `<div class="hero"><div><span class="tag">✨ Feitos com carinho</span><h1>Pequenos doces,<br>grandes momentos.</h1><p>Encomende seus favoritos com poucos toques.</p></div><div class="art">🧁</div></div><div class="section"><h2>Nosso cardápio</h2><span class="muted tiny">${prods.length} opções</span></div><input class="search" placeholder="🔎  Qual docinho você procura?" value="${esc(query)}" oninput="query=this.value;updateGrid()"><div class="chips">${categories.map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div id="productGrid">${cards(prods)}</div>${count()?`<div class="cart-summary"><div><b>${count()} unidades selecionadas</b><small>Total: ${money(total())}</small></div><button onclick="navigate('cart')">Ver carrinho →</button></div>`:''}<div class="footer">Feito com amor, um docinho de cada vez 💗</div>`}
function cards(ps){return ps.length?'<div class="grid shop-grid">'+ps.map(p=>'<article class="card shop-card"><div class="pic">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':esc(p.emoji))+'</div><div class="body"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><strong class="price">'+money(p.price)+'</strong><small class="muted">Mínimo: '+(p.minQty||1)+' · de '+(p.qtyStep||1)+' em '+(p.qtyStep||1)</small><button class="btn primary full" '+(p.stock<(p.minQty||1)?'disabled':'')+' onclick="chooseProduct('+p.id+')">'+(p.stock<(p.minQty||1)?'Indisponível':'Escolher quantidade')+'</button></div></article>').join('')+'</div>':'<div class="empty">Nenhum produto encontrado.</div>'}
function chooseProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;let min=p.minQty||1,available=p.stock-(cart[id]||0);if(available<min)return notify('Estoque insuficiente para a quantidade mínima.');showModal('<div class="choose-product"><div class="choose-photo">'+(p.image?'<img src="'+esc(p.image)+'">':'<span>'+esc(p.emoji)+'</span>')+'</div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.desc)+'</p><div class="choose-detail"><span>Preço unitário</span><b>'+money(p.price)+'</b></div><div class="choose-detail"><span>Compra mínima</span><b>'+min+' unidades (de '+(p.qtyStep||1)+' em '+(p.qtyStep||1)+')</b></div><label class="field">Quantidade desejada<input id="chosenQty" type="number" inputmode="numeric" min="'+min+'" max="'+available+'" step="'+(p.qtyStep||1)+'" value="'+min+'" oninput="previewChoice('+id+')"></label><div class="choose-stepper"><button onclick="stepChoice('+id+',-1)">−</button><strong id="chosenLabel">'+min+' unidades</strong><button onclick="stepChoice('+id+',1)">+</button></div><div class="choose-total"><span>Total deste produto</span><strong id="chosenTotal">'+money(min*p.price)+'</strong></div><button class="btn primary full" onclick="confirmChoice('+id+')">Adicionar ao carrinho</button></div>')}
function choiceAmount(id){let p=db.products.find(x=>x.id===id),n=+document.getElementById('chosenQty')?.value;return p&&Number.isInteger(n)&&n>=(p.minQty||1)&&n<=p.stock-(cart[id]||0)&&(n-(p.minQty||1))%(p.qtyStep||1)===0?n:null}

function stepChoice(id,delta){let p=db.products.find(x=>x.id===id),input=document.getElementById('chosenQty');let n=Number(input.value)||p.minQty||1;input.value=Math.min(p.stock-(cart[id]||0),Math.max(p.minQty||1,Math.floor(n)+delta*(p.qtyStep||1)));previewChoice(id)}
function confirmChoice(id){let n=choiceAmount(id);if(n===null)return notify('Quantidade inválida.');cart[id]=(cart[id]||0)+n;closeModal();render();notify(n+' unidades adicionadas.')}
function updateGrid(){document.getElementById('productGrid').innerHTML=cards(db.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase()))))}function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=(cart[id]||0))return notify('Estoque insuficiente.');cart[id]=(cart[id]||0)+1;render()}
function qty(id,delta){let p=db.products.find(x=>x.id===+id);if(!p)return;let next=(cart[id]||0)+delta*(p.qtyStep||1);if(next===0)delete cart[id];else if(next<(p.minQty||1))return notify('Mínimo de '+(p.minQty||1)+' unidades. Use Remover para excluir.');else if(next>p.stock)return notify('Estoque insuficiente.');else if((next-(p.minQty||1))%(p.qtyStep||1)!==0)return notify('Quantidade fora dos incrementos permitidos.');else cart[id]=next;render()}

function renderCart(){let entries=Object.entries(cart);return `<div class="section"><h2>Meu carrinho</h2></div>${entries.length?`<div class="panel">${entries.map(([id,q])=>{let p=db.products.find(p=>p.id===+id);return p?`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${q} un × ${money(p.price)} = ${money(q*p.price)}</small><small class="muted">Mín. ${p.minQty||1} · incremento ${p.qtyStep||1}</small></div><button class="btn" onclick="qty(${id},-1)">−</button><b>${q}</b><button class="btn" onclick="qty(${id},1)">+</button><button class="btn" onclick="removeCartItem(${id})">Remover</button></div>`:''}).join('')}</div><div class="panel stack"><div class="row"><span>Subtotal</span><b>${money(total())}</b></div><div class="row"><span>Entrega (se escolhida)</span><b>${money(db.settings.deliveryFee)}</b></div><div class="note">O valor de entrega será adicionado apenas se você escolher entrega.</div><button class="btn primary full" onclick="checkout()">Finalizar pedido →</button></div>`:'<div class="empty"><span>🛒</span>Seu carrinho está vazio.<p><button class="btn primary" onclick="navigate(\'home\')">Ver cardápio</button></p></div>'}`}
function checkout(){if(!count())return;showModal(`<h2>Finalizar pedido</h2><form class="stack" onsubmit="placeOrder(event)"><label class="field">Seu nome<input name="customer" required maxlength="80" value="${esc(db.customer.name)}" placeholder="Como podemos chamar você?"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="${esc(db.customer.phone)}" placeholder="(41) 99999-9999"></label><label class="field">Recebimento<select name="method" onchange="document.getElementById('addressfield').classList.toggle('hidden',this.value!=='Entrega')"><option>Retirada</option><option>Entrega</option></select></label><label class="field hidden" id="addressfield">Endereço de entrega<textarea name="address" placeholder="Rua, número, bairro, complemento">${esc(db.customer.address)}></textarea></label><label class="field">Observações<textarea name="notes" placeholder="Ex.: sem confeitos, horário preferido"></textarea></label><label class="field">Pagamento<select name="payment"><option value="Na retirada">Pagar na retirada</option><option value="Pix">Pix (instruções manuais)</option></select></label><div class="note">Pix demonstrativo: não gera cobrança automática e não confirma pagamento pelo banco.</div><button class="btn primary full">Confirmar pedido</button><button type="button" class="btn full" onclick="closeModal()">Voltar</button></form>`)}function placeOrder(e){e.preventDefault();const f=new FormData(e.target),method=f.get('method'),address=String(f.get('address')||'').trim();if(method==='Entrega'&&!address)return notify('Informe o endereço de entrega');for(let [id,q] of Object.entries(cart)){let p=db.products.find(x=>x.id===+id);if(!p||p.stock<q||q<(p.minQty||1)||(q-(p.minQty||1))%(p.qtyStep||1)!==0)return notify('Revise a quantidade mínima e os incrementos do carrinho.')}let items=Object.entries(cart).map(([id,q])=>{let p=db.products.find(x=>x.id===+id);return {id:+id,name:p.name,qty:q,price:p.price,cost:p.cost}});for(let i of items)db.products.find(p=>p.id===i.id).stock-=i.qty;db.customer={name:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),address,notes:String(f.get('notes')||'')};let order={payment:String(f.get('payment')||'Na retirada'),paymentStatus:'Não confirmado',id:Date.now(),created:new Date().toISOString(),customer:String(f.get('customer')).trim(),phone:String(f.get('phone')).trim(),method,address,notes:String(f.get('notes')||''),items,subtotal:total(),fee:method==='Entrega'?+db.settings.deliveryFee:0,status:'Recebido'};db.orders.unshift(order);cart={};save();closeModal();page='orders';render();notify('Pedido registrado neste dispositivo! Para encomendas reais, a loja precisará de um servidor compartilhado.')}function renderOrders(){return `<div class="section"><h2>Pedidos neste aparelho</h2></div><div class="note">Demonstração local: pedidos de outros celulares não aparecem aqui.</div>${db.orders.length?db.orders.map(o=>`<div class="panel"><div class="row"><b>Pedido #${String(o.id).slice(-6)}</b><span class="pill">${esc(o.status)}</span></div><p class="muted tiny">${new Date(o.created).toLocaleString('pt-BR')} · ${esc(o.method)}</p><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</p><p class="muted tiny">Pagamento: ${esc(o.payment||'Na retirada')} · ${esc(o.paymentStatus||'Não confirmado')}</p>${o.payment==='Pix'&&db.settings.pixKey?`<div class="note"><b>Pix da loja</b><p>Chave: <strong>${esc(db.settings.pixKey)}</strong></p><button class="btn" onclick="navigator.clipboard?.writeText(db.settings.pixKey).then(()=>notify('Chave Pix copiada'))">Copiar chave</button><p class="tiny">A confirmação é manual. Não marque como pago sem verificar o extrato.</p></div>`:''}<div class="row"><b>${money(o.subtotal+o.fee)}</b><button class="btn" onclick="shareOrder(${o.id})">💬 Compartilhar</button></div></div>`).join(''):'<div class="empty"><span>🧾</span>Você ainda não fez pedidos.</div>'}`}
function message(o){return `Olá! Pedido #${String(o.id).slice(-6)} de ${o.customer}:\n${o.items.map(i=>`${i.qty}x ${i.name}`).join('\n')}\n${o.method}${o.address?' - '+o.address:''}\nTotal: ${money(o.subtotal+o.fee)}\nObs: ${o.notes}`};function shareOrder(id){let o=db.orders.find(o=>o.id===id);let number=db.settings.whatsapp.replace(/\D/g,'');if(number)window.open(`https://wa.me/${number}?text=${encodeURIComponent(message(o))}`,'_blank','noopener');else if(navigator.share)navigator.share({text:message(o)}).catch(()=>{});else navigator.clipboard?.writeText(message(o)).then(()=>notify('Pedido copiado. Configure WhatsApp da loja para envio direto.'))}function renderProfile(){return `<div class="section"><h2>👤 Minha conta</h2></div><div class="panel"><p class="muted">Salve seus dados para preencher seus próximos pedidos automaticamente neste aparelho.</p><form class="stack" onsubmit="saveProfile(event)"><label class="field">Nome<input name="name" required maxlength="80" value="${esc(db.customer.name)}"></label><label class="field">WhatsApp<input name="phone" required maxlength="25" value="${esc(db.customer.phone)}"></label><label class="field">Endereço<textarea name="address">${esc(db.customer.address)}</textarea></label><label class="field">Preferências e observações<textarea name="notes">${esc(db.customer.notes)}</textarea></label><button class="btn primary full">Salvar meus dados</button></form></div><div class="note">Dados salvos apenas neste navegador, sem login real ou sincronização entre aparelhos.</div>`}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target);db.customer={name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),address:String(f.get('address')||'').trim(),notes:String(f.get('notes')||'').trim()};save();render();notify('Dados salvos neste aparelho')}
function renderContact(){return `<div class="section"><h2>Fale com a gente</h2></div><div class="panel stack"><div style="font-size:55px;text-align:center">💌</div><h2 style="text-align:center;margin:0">Um carinho em cada detalhe</h2><p class="muted" style="text-align:center">Dúvidas sobre sabores, encomendas e eventos? Entre em contato.</p><button class="btn primary full" onclick="contact()">💬 Conversar pelo WhatsApp</button></div><div class="panel"><b>Sobre o aplicativo</b><p class="muted">Catálogo, carrinho e pedidos demonstrativos. Os dados ficam somente neste navegador até conectar um backend.</p></div>`}function contact(){let n=db.settings.whatsapp.replace(/\D/g,'');if(!n)return notify('O WhatsApp da loja ainda não foi configurado.');window.open(`https://wa.me/${n}?text=${encodeURIComponent('Olá! Gostaria de saber mais sobre os docinhos gourmet.')}`,'_blank','noopener')}
function showModal(html){document.getElementById('modalhost').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalhost').innerHTML=''}function openAccess(){if(admin){admin=false;page='home';render();return}showModal(`<h2>🔐 Área administrativa</h2><p class="muted">Nesta demonstração, o acesso administrativo é apenas uma simulação visual.</p><div class="note">⚠️ Sem backend e autenticação, não há proteção real dos dados ou das funções administrativas. Não utilize para uma loja em produção.</div><div class="stack" style="margin-top:14px"><button class="btn primary full" onclick="admin=true;tab='dashboard';closeModal();render()">Entrar no painel de demonstração</button><button class="btn full" onclick="closeModal()">Continuar como cliente</button></div>`)}
function renderAdmin(){return `<div class="adminbar row"><div><b>🛡️ Gestão da loja</b><div class="tiny muted">Modo demonstração · acesso não protegido</div></div><button class="btn" onclick="admin=false;page='home';render()">Sair</button></div><div class="tabs">${[['dashboard','Visão geral'],['products','Produtos'],['deliveries','Pedidos'],['stock','Estoque'],['pantry','Despensa'],['planner','Produção'],['settings','Configurações']].map(([k,t])=>`<button class="btn ${tab===k?'on':''}" onclick="tab='${k}';render()">${t}</button>`).join('')}</div>${tab==='dashboard'?adminDashboard():tab==='products'?adminProducts():tab==='deliveries'?adminOrders():tab==='stock'?adminStock():tab==='pantry'?adminPantry():tab==='planner'?adminPlanner():adminSettings()}`}
function adminDashboard(){let gross=db.orders.filter(o=>o.status!=='Cancelado').reduce((a,o)=>a+o.subtotal,0),cost=db.orders.filter(o=>o.status!=='Cancelado').reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.qty*i.cost,0),0),pending=db.orders.filter(o=>!['Entregue','Concluído','Cancelado'].includes(o.status)).length;return `<div class="section"><h2>Dashboard</h2><span class="pill">Admin demo</span></div><div class="stats"><div class="stat"><strong>${db.orders.length}</strong><span>Pedidos registrados</span></div><div class="stat"><strong>${money(gross)}</strong><span>Receita de produtos*</span></div><div class="stat"><strong>${money(gross-cost)}</strong><span>Lucro bruto estimado*</span></div><div class="stat"><strong>${pending}</strong><span>Pedidos em aberto</span></div></div><div class="panel"><h3>📈 Resumo do negócio</h3><p>Produtos cadastrados: <b>${db.products.length}</b></p><p>Itens com estoque baixo (≤ 5): <b>${db.products.filter(p=>p.stock<=5).length}</b></p><p class="muted tiny">* Estimativas sem impostos, taxas, despesas fixas, perdas ou custo de entrega. Pedidos cancelados excluídos; os demais são incluídos independentemente de pagamento.</p></div><div class="panel"><h3>Últimos pedidos</h3>${db.orders.slice(0,4).map(o=>`<div class="item"><div class="emoji">🧾</div><div class="info"><strong>${esc(o.customer)}</strong><small>${esc(o.status)} · ${esc(o.method)}</small></div><b>${money(o.subtotal+o.fee)}</b></div>`).join('')||'<p class="muted">Nenhum pedido ainda.</p>'}</div>`}
function adminProducts(){return `<div class="section"><h2>Catálogo</h2><button class="btn primary" onclick="editProduct()">＋ Novo doce</button></div><div class="panel">${db.products.map(p=>`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${money(p.price)} · custo ${money(p.cost)} · ${p.active?'Visível':'Oculto'}</small><small style="display:block">Margem bruta: ${p.price>0?(((p.price-p.cost)/p.price)*100).toFixed(1):0}%</small></div><button class="btn" onclick="editProduct(${p.id})">Editar</button></div>`).join('')}</div>`}function editProduct(id){let p=db.products.find(p=>p.id===id)||{name:'',cat:'Brigadeiros',desc:'',price:0,cost:0,stock:0,minQty:1,qtyStep:1,emoji:'🍬',active:true,image:''};showModal(`<h2>${id?'Editar doce':'Novo doce'}</h2><form class="stack" onsubmit="saveProduct(event,${id||0})"><label class="field">Nome<input name="name" required maxlength="70" value="${esc(p.name)}"></label><label class="field">Categoria<input name="cat" required maxlength="40" value="${esc(p.cat)}"></label><label class="field">Descrição<textarea name="desc">${esc(p.desc)}</textarea></label><div class="two"><label class="field">Preço (R$)<input type="number" name="price" min="0.01" step="0.01" required value="${p.price}"></label><label class="field">Custo unitário (R$)<input type="number" name="cost" min="0" step="0.01" required value="${p.cost}"></label></div><div class="two"><label class="field">Estoque<input type="number" name="stock" min="0" step="1" required value="${p.stock}"></label><label class="field">Emoji / ícone<input name="emoji" maxlength="8" value="${esc(p.emoji)}"></label></div><div class="two"><label class="field">Quantidade mínima<input type="number" name="minQty" min="1" step="1" required value="${p.minQty||1}"></label><label class="field">Incremento de compra<input type="number" name="qtyStep" min="1" step="1" required value="${p.qtyStep||1}"></label></div><p class="muted tiny">Exemplo: mínimo 50 e incremento 25 permite 50, 75, 100, 125...</p><label class="field">Imagem do doce (JPG, PNG ou WebP, até 250 KB)<input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp"><small>Opcional. A imagem fica salva apenas neste navegador; use arquivos leves.</small></label><label class="field">URL de imagem (opcional)<input name="imageUrl" type="url" value="${esc(p.image?.startsWith('data:')?'':p.image||'')}" placeholder="https://..."></label><label><input type="checkbox" name="active" ${p.active?'checked':''}> Exibir no cardápio</label><button class="btn primary full">Salvar doce</button><button type="button" class="btn full" onclick="closeModal()">Cancelar</button></form>`)}async function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),p={id:id||db.nextId++,name:String(f.get('name')).trim(),cat:String(f.get('cat')).trim(),desc:String(f.get('desc')).trim(),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),minQty:Math.max(1,Math.floor(+f.get('minQty')||1)),qtyStep:Math.max(1,Math.floor(+f.get('qtyStep')||1)),emoji:String(f.get('emoji')).trim()||'🍬',image:String(f.get('imageUrl')||'').trim()||(db.products.find(x=>x.id===id)?.image||''),active:f.has('active')};if(p.price<=0||p.cost<0||p.stock<0||!Number.isInteger(+f.get('minQty'))||+f.get('minQty')<1||!Number.isInteger(+f.get('qtyStep'))||+f.get('qtyStep')<1)return notify('Revise os valores');let photo=f.get('imageFile');if(photo&&photo.size){if(photo.size>250000)return notify('A imagem deve ter até 250 KB.');if(!['image/jpeg','image/png','image/webp'].includes(photo.type))return notify('Formato de imagem inválido.');p.image=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(photo)})}let idx=db.products.findIndex(x=>x.id===id);if(idx>=0)db.products[idx]=p;else db.products.push(p);save();closeModal();render()}
const statuses=['Recebido','Em preparo','Pronto','Saiu para entrega','Entregue','Concluído','Cancelado'];function adminOrders(){return `<div class="section"><h2>Pedidos e entregas</h2></div>${db.orders.length?db.orders.map(o=>`<div class="panel"><div class="row"><b>#${String(o.id).slice(-6)} · ${esc(o.customer)}</b><b>${money(o.subtotal+o.fee)}</b></div><p class="muted tiny">${esc(o.phone)} · ${esc(o.method)} ${o.address?'· '+esc(o.address):''}</p><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</p><label class="field">Situação<select onchange="setStatus(${o.id},this.value)">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></label><p class="tiny muted">${esc(o.notes||'Sem observações')}</p></div>`).join(''):'<div class="empty"><span>🚚</span>Nenhum pedido cadastrado.</div>'}`}function setStatus(id,s){let o=db.orders.find(o=>o.id===id);if(!o)return;if(s==='Cancelado'&&o.status!=='Cancelado'){for(let i of o.items){let p=db.products.find(p=>p.id===i.id);if(p)p.stock+=i.qty}}else if(o.status==='Cancelado'&&s!=='Cancelado'){for(let i of o.items){let p=db.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return notify('Estoque insuficiente para reativar pedido')}for(let i of o.items)db.products.find(p=>p.id===i.id).stock-=i.qty}o.status=s;save();render()}function adminStock(){return `<div class="section"><h2>Controle de estoque</h2></div><div class="panel">${db.products.map(p=>`<div class="item"><div class="emoji">${esc(p.emoji)}</div><div class="info"><strong>${esc(p.name)}</strong><small>${p.stock<=5?'⚠️ Estoque baixo':'Unidades disponíveis'}</small></div><button class="btn" onclick="adjust(${p.id},-1)">−</button><b>${p.stock}</b><button class="btn" onclick="adjust(${p.id},1)">+</button></div>`).join('')}</div><p class="muted tiny">O estoque é de unidades de produtos finais, não de ingredientes. Ajustes manuais são demonstrativos.</p>`}function adjust(id,n){let p=db.products.find(p=>p.id===id);p.stock=Math.max(0,p.stock+n);save();render()}


function pantryBalance(i){return +(+i.qty||0).toFixed(3)}
function ingredientCost(i){return i.qty>0?(+i.stockValue||0)/i.qty:(+i.lastUnitCost||(+i.price||0)/(+i.packQty||1))}
function pantryMoney(v){return money(v)}
function ensurePantryMigration(){db.pantry=db.pantry||[];db.pantryEntries=db.pantryEntries||[];db.pantryMovements=db.pantryMovements||[];db.pantryLots=db.pantryLots||[];db.pantry.forEach(i=>{if(i.trackExpiry===undefined)i.trackExpiry=false;if(i.stockValue===undefined){i.stockValue=(+i.qty||0)*((+i.price||0)/(+i.packQty||1));i.lastUnitCost=(+i.price||0)/(+i.packQty||1);i.initialMigrated=true}if(!i.packQty||i.packQty<=0)i.packQty=1})}
ensurePantryMigration();
function recipeCost(rec){return (rec.ingredients||[]).reduce((sum,line)=>{let i=db.pantry.find(x=>x.id===line.id);return sum+(i?ingredientCost(i)*line.qty:0)},0)}
function recipeNeeds(rec,batches){return (rec.ingredients||[]).map(line=>{let i=db.pantry.find(x=>x.id===line.id);return i?{item:i,qty:line.qty*batches,short:Math.max(0,line.qty*batches-availableForProduction(i))}:null}).filter(Boolean)}
function adminPantry(){let low=db.pantry.filter(i=>i.qty<=i.min),expired=db.pantryLots.filter(l=>l.qty>0&&l.expiry&&l.expiry<todayISO()),soon=db.pantryLots.filter(l=>l.qty>0&&l.expiry&&l.expiry>=todayISO()&&daysUntil(l.expiry)<=7);return `<div class="section"><h2>🥣 Despensa</h2></div><div class="panel"><div class="row"><button class="btn primary" onclick="editIngredient()">＋ Cadastrar ingrediente</button><button class="btn" onclick="stockEntry()">📥 Entrada de estoque</button></div><p class="muted tiny">Cadastre cada ingrediente uma vez. Registre compras separadamente, com quantidade e preço reais. As receitas utilizam o custo médio ponderado disponível.</p></div>${low.length?'<div class="note">⚠️ '+low.length+' ingrediente(s) com estoque baixo: '+low.map(i=>esc(i.name)).join(', ')+'</div>':''}${expired.length?'<div class="note">🚫 '+expired.length+' lote(s) vencido(s): '+expired.map(l=>esc(db.pantry.find(i=>i.id===l.ingredientId)?.name||'Ingrediente')+' ('+esc(l.expiry)+')').join(', ')+'</div>':''}${soon.length?'<div class="note">⏰ '+soon.length+' lote(s) vencendo em até 7 dias.</div>':''}${db.pantry.length?db.pantry.map(i=>`<div class="panel"><div class="row"><div><b>${esc(i.name)}</b><p class="muted tiny">Cadastro permanente · ${esc(i.unit)} · ${i.packQty} ${esc(i.unit)} por embalagem</p></div><button class="btn" onclick="editIngredient(${i.id})">Editar</button></div><div class="row"><span>Saldo: <b>${pantryBalance(i)} ${esc(i.unit)}</b></span><span>Custo médio: <b>${pantryMoney(ingredientCost(i))}/${esc(i.unit)}</b></span></div><div class="row"><span>Valor em estoque: ${pantryMoney(i.stockValue||0)}</span><span>${i.qty<=i.min?'⚠️ Repor':'✓ Adequado'}</span><span>${i.trackExpiry?'📅 Validade controlada':'Validade não controlada'}</span></div><button class="btn" onclick="stockEntry(${i.id})">＋ Registrar compra</button>${i.trackExpiry?db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0).map(l=>`<p class="muted tiny">Lote ${esc(l.code)} · ${l.qty} ${esc(i.unit)} · validade ${esc(l.expiry||'não informada')} ${l.expiry&&l.expiry<todayISO()?'🚫 VENCIDO':l.expiry&&daysUntil(l.expiry)<=7?'⏰ Vence em breve':''}</p>`).join(''):''}</div>`).join(''):'<div class="panel">Cadastre o primeiro ingrediente para começar a controlar suas compras.</div>'}<div class="section"><h3>🧾 Últimas movimentações</h3></div>${db.pantryMovements.slice(-12).reverse().map(m=>`<div class="panel"><div class="row"><b>${esc(m.name)}</b><span>${new Date(m.at).toLocaleDateString('pt-BR')}</span></div><p class="muted">${esc(m.kind)} · ${m.qty} ${esc(m.unit)} · ${pantryMoney(m.total||0)}</p></div>`).join('')||'<div class="panel">Nenhuma movimentação registrada.</div>'}`;}
function editIngredient(id){let i=db.pantry.find(x=>x.id===id)||{name:'',unit:'un',qty:0,min:0,packQty:1};showModal(`<h2>${id?'Editar ingrediente':'Cadastrar ingrediente'}</h2><p class="muted">Este é um cadastro reutilizável. Quantidades e valores de compras são informados em Entrada de estoque.</p><form class="stack" onsubmit="saveIngredient(event,${id||0})"><label class="field">Nome<input name="name" required maxlength="100" value="${esc(i.name)}"></label><label class="field">Unidade de controle<select name="unit">${['un','g','ml'].map(u=>`<option value="${u}" ${u===i.unit?'selected':''}>${u==='un'?'Unidade (un)':u==='g'?'Gramas (g)':'Mililitros (ml)'}</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade por embalagem<input type="number" name="packQty" min=".001" step=".001" required value="${i.packQty}"></label><label class="field">Estoque mínimo<input type="number" name="min" min="0" step=".001" required value="${i.min}"></label></div><label class="field"><input type="checkbox" name="trackExpiry" ${i.trackExpiry?'checked':''}> Controlar validade deste ingrediente</label><div class="note">Se marcado, cada nova entrada exigirá uma data de validade e a produção consumirá primeiro os lotes que vencem antes. Se desmarcado, o sistema não exige nem controla validade. Exemplo: creme de leite comprado por unidade: unidade = un e quantidade por embalagem = 1. Leite condensado em lata: un e 1. Chocolate a granel: g e 1000 para pacote de 1 kg.</div><button class="btn primary full">Salvar cadastro</button></form>`)}
function saveIngredient(e,id){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),unit=String(f.get('unit')),packQty=+f.get('packQty'),min=+f.get('min'),trackExpiry=f.has('trackExpiry');if(!name||packQty<=0||min<0)return notify('Revise os dados.');if(db.pantry.some(i=>i.id!==id&&i.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))return notify('Este ingrediente já está cadastrado. Use Entrada de estoque.');let at=db.pantry.findIndex(x=>x.id===id);if(at>=0){let old=db.pantry[at];if(old.qty>0&&old.unit!==unit)return notify('Não altere a unidade de um ingrediente com estoque. Consuma ou ajuste o saldo antes.');Object.assign(old,{name,unit,packQty,min,trackExpiry})}else db.pantry.push({id:Date.now(),name,unit,packQty,min,trackExpiry,qty:0,stockValue:0,lastUnitCost:0});save();closeModal();render()}
function stockEntry(id){if(!db.pantry.length)return notify('Cadastre um ingrediente primeiro.');let selected=db.pantry.find(i=>i.id===id)||db.pantry[0];showModal(`<h2>📥 Entrada de estoque</h2><p class="muted">Selecione o ingrediente já cadastrado e informe a quantidade de embalagens compradas e o preço total da compra.</p><form class="stack" onsubmit="saveStockEntry(event)"><label class="field">Ingrediente<select name="id" id="entryIngredient" onchange="updateEntryPreview()">${db.pantry.map(i=>`<option value="${i.id}" ${i.id===selected.id?'selected':''}>${esc(i.name)} · ${i.packQty} ${esc(i.unit)}/embalagem</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade de embalagens<input id="entryPacks" name="packs" type="number" min=".001" step=".001" required value="1" oninput="updateEntryPreview()"></label><label class="field">Preço TOTAL pago (R$)<input id="entryTotal" name="total" type="number" min="0" step=".01" required placeholder="Ex.: 12,00" oninput="updateEntryPreview()"></label></div><div id="expiryFields"></div><div class="note" id="entryPreview">Informe a quantidade e o preço para calcular o custo.</div><button class="btn primary full">Confirmar entrada de estoque</button></form>`);updateEntryPreview()}
function updateEntryPreview(){let el=document.getElementById('entryPreview'),i=db.pantry.find(x=>x.id===+document.getElementById('entryIngredient')?.value),packs=+document.getElementById('entryPacks')?.value,total=+document.getElementById('entryTotal')?.value;let expiryArea=document.getElementById('expiryFields');if(expiryArea&&i)expiryArea.innerHTML=i.trackExpiry?'<div class="two"><label class="field">Código do lote<input name="lotCode" maxlength="40" placeholder="Ex.: LOTE-01"></label><label class="field">Validade do lote<input name="expiry" type="date" required min="'+todayISO()+'"></label></div><p class="muted tiny">A validade é obrigatória apenas para ingredientes com controle ativado.</p>':'';if(el&&i&&packs>0)el.textContent='Entrada: '+(packs*i.packQty).toFixed(3)+' '+i.unit+' · Custo desta compra: '+money(total/(packs*i.packQty))+'/'+i.unit+' · Saldo após entrada: '+(i.qty+packs*i.packQty).toFixed(3)+' '+i.unit}
function saveStockEntry(e){e.preventDefault();let f=new FormData(e.target),i=db.pantry.find(x=>x.id===+f.get('id')),packs=+f.get('packs'),total=+f.get('total');if(!i||packs<=0||!Number.isFinite(total)||total<0)return notify('Revise a entrada.');let expiry=String(f.get('expiry')||''),lotCode=String(f.get('lotCode')||'').trim();if(i.trackExpiry&&(!/^\\d{4}-\\d{2}-\\d{2}$/.test(expiry)||expiry<todayISO()))return notify('Informe uma validade válida e não vencida.');let qty=+(packs*i.packQty).toFixed(3),unitCost=total/qty;i.qty=+(i.qty+qty).toFixed(3);i.stockValue=+(i.stockValue+total).toFixed(4);i.lastUnitCost=unitCost;db.pantryLots.push({id:Date.now()+Math.random(),ingredientId:i.id,code:lotCode||'LOTE-'+Date.now(),expiry:i.trackExpiry?expiry:null,qty,unitCost,at:Date.now()});db.pantryMovements.push({at:Date.now(),kind:'Entrada',id:i.id,name:i.name,unit:i.unit,qty,total,packs,unitCost});save();closeModal();render();notify('Compra registrada. Estoque e custo médio atualizados.')}
function todayISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(date){let now=new Date(todayISO()+'T12:00:00'),target=new Date(date+'T12:00:00');return Math.round((target-now)/86400000)}
function availableForProduction(i){if(!i.trackExpiry)return i.qty;let lots=db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0);let accounted=lots.reduce((s,l)=>s+l.qty,0);let legacy=Math.max(0,i.qty-accounted);return legacy+lots.filter(l=>!l.expiry||l.expiry>=todayISO()).reduce((s,l)=>s+l.qty,0)}
function consumeLots(i,qty){let remaining=qty;let lots=db.pantryLots.filter(l=>l.ingredientId===i.id&&l.qty>0&&(!i.trackExpiry||!l.expiry||l.expiry>=todayISO())).sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31')||a.at-b.at);for(let l of lots){let taken=Math.min(remaining,l.qty);l.qty=+(l.qty-taken).toFixed(3);remaining=+(remaining-taken).toFixed(3);if(remaining<=0)break}return remaining}
function adminPlanner(){let pending=db.orders.filter(o=>!['Cancelado','Concluído','Entregue'].includes(o.status));let demand={};pending.forEach(o=>(o.items||[]).forEach(i=>demand[i.id]=(demand[i.id]||0)+i.qty));let needs=[],alerts=[];let cards=db.recipes.map(rec=>{let prod=db.products.find(x=>x.id===rec.product),qty=demand[rec.product]||0,yieldQty=Math.max(1,rec.yieldQty),batches=Math.ceil(Math.max(0,qty-(prod?.stock||0))/yieldQty),cost=recipeCost(rec),short=recipeNeeds(rec,batches).filter(x=>x.short>0);short.forEach(x=>alerts.push({name:x.item.name,qty:x.short,unit:x.item.unit}));needs.push({rec,qty,batches,cost,short});return `<div class="panel"><div class="row"><b>${esc(prod?.name||'Produto excluído')}</b><button class="btn" onclick="editRecipe(${rec.id})">Ficha técnica</button></div><p>Rendimento: <b>${yieldQty} unidades/receita</b> · Custo da receita: <b>${money(cost)}</b> · Custo unitário: <b>${money(cost/yieldQty)}</b></p><p>Pedidos abertos: ${qty} · Estoque pronto: ${prod?.stock||0} · <b>Produzir: ${batches} receita(s)</b></p>${short.length?'<div class="note">⚠️ Falta para produzir: '+short.map(x=>esc(x.item.name)+' ('+x.short.toFixed(2)+' '+esc(x.item.unit)+')').join(', ')+'</div>':'<p class="muted">✓ Ingredientes suficientes para esta previsão, sujeitos ao consumo por outras receitas.</p>'}<button class="btn primary" onclick="produce(${rec.id},${batches})" ${!batches||short.length?'disabled':''}>Registrar produção de ${batches} receita(s)</button></div>`}).join('');let combined=new Map();needs.forEach(n=>recipeNeeds(n.rec,n.batches).forEach(x=>{let cur=combined.get(x.item.id)||{item:x.item,qty:0};cur.qty+=x.qty;combined.set(x.item.id,cur)}));let shopping=[...combined.values()].filter(x=>x.qty>x.item.qty);let boxes=[4,6,10].map(n=>{let ps=db.products.filter(p=>p.active&&p.stock>=n),best=ps.map(p=>({p,margin:n*p.price-n*(db.recipes.find(r=>r.product===p.id)?recipeCost(db.recipes.find(r=>r.product===p.id))/db.recipes.find(r=>r.product===p.id).yieldQty:p.cost)})).sort((a,b)=>b.margin-a.margin)[0];return `<div class="panel"><b>📦 Caixa de ${n} unidades</b><p class="muted">Comparação indicativa usando doces disponíveis. Cadastre uma caixa como produto para vender com preço próprio.</p><p>${best?'Exemplo com '+esc(best.p.name)+' · margem bruta avulsa equivalente: '+money(best.margin):'Sem quantidade pronta suficiente para simular.'}</p></div>`}).join('');return `<div class="section"><h2>🧠 Planejamento inteligente</h2><button class="btn primary" onclick="editRecipe()">＋ Ficha técnica</button></div><div class="note">Previsão baseada nos pedidos registrados neste navegador, no estoque pronto e no rendimento informado. Não substitui controle integrado de produção.</div><div class="section"><h3>🛒 Alertas de compra</h3></div>${shopping.length?shopping.map(x=>`<div class="note">⚠️ ${esc(x.item.name)}: faltam ${(x.qty-x.item.qty).toFixed(2)} ${esc(x.item.unit)} para atender à produção planejada.</div>`).join(''):'<div class="panel">Nenhuma falta identificada para os pedidos abertos.</div>'}<div class="section"><h3>🍬 Receitas e demanda</h3></div>${cards||'<div class="panel">Cadastre fichas técnicas para calcular ingredientes, custos e produção.</div>'}<div class="section"><h3>📦 Aproveitamento de excedentes</h3></div>${boxes}<div class="panel"><h3>Destino das sobras</h3><form class="stack" onsubmit="allocateLeftovers(event)"><label class="field">Produto<select name="product">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} disponíveis)</option>`).join('')}</select></label><div class="two"><label class="field">Quantidade<input name="qty" type="number" min="1" step="1" required></label><label class="field">Destino<select name="reason"><option>Descarte</option><option>Cortesia</option><option>Reservar caixa 4</option><option>Reservar caixa 6</option><option>Reservar caixa 10</option></select></label></div><button class="btn primary full">Registrar destinação</button></form><p class="muted tiny">Ao reservar para caixas, as unidades saem do estoque avulso para evitar venda duplicada. A caixa final ainda precisa ser registrada como produto separado.</p></div>${db.allocations.slice(-6).reverse().map(a=>`<p class="muted tiny">${new Date(a.at).toLocaleString('pt-BR')} · ${esc(a.product)} · ${a.qty} un · ${esc(a.reason)}</p>`).join('')}`;}
function editRecipe(id){let r=db.recipes.find(x=>x.id===id)||{product:db.products[0]?.id,yieldQty:20,ingredients:[]};showModal(`<h2>Ficha técnica da receita</h2><form class="stack" onsubmit="saveRecipe(event,${id||0})"><label class="field">Produto final<select name="product">${db.products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Rendimento em unidades<input type="number" name="yieldQty" min="1" step="1" required value="${r.yieldQty}"></label><p class="muted">Informe quanto de cada ingrediente é usado para UMA receita completa.</p>${db.pantry.map(i=>`<label class="field">${esc(i.name)} (${esc(i.unit)})<input type="number" name="ing_${i.id}" min="0" step=".001" value="${r.ingredients.find(x=>x.id===i.id)?.qty||0}"></label>`).join('')||'<div class="note">Cadastre ingredientes na Despensa antes de montar a receita.</div>'}<button class="btn primary full">Salvar ficha técnica</button></form>`)}
function saveRecipe(e,id){e.preventDefault();let f=new FormData(e.target),product=+f.get('product'),yieldQty=+f.get('yieldQty'),ingredients=db.pantry.map(i=>({id:i.id,qty:+f.get('ing_'+i.id)||0})).filter(x=>x.qty>0);if(!product||yieldQty<1)return notify('Revise rendimento e produto.');let recipe={id:id||Date.now(),product,yieldQty,ingredients},at=db.recipes.findIndex(r=>r.id===id);if(at>=0)db.recipes[at]=recipe;else db.recipes.push(recipe);save();closeModal();render()}
function produce(id,batches){let r=db.recipes.find(x=>x.id===id),p=db.products.find(x=>x.id===r?.product);if(!r||!p||batches<1)return;let req=recipeNeeds(r,batches);if(req.some(x=>x.short>0))return notify('Ingredientes insuficientes ou com validade vencida.');if(!confirm('Registrar produção de '+batches+' receita(s), consumindo ingredientes da despensa e adicionando '+(r.yieldQty*batches)+' unidades ao estoque?'))return;req.forEach(x=>{consumeLots(x.item,x.qty);let unitCost=ingredientCost(x.item),consumed=+(unitCost*x.qty).toFixed(4);x.item.qty=+(x.item.qty-x.qty).toFixed(3);x.item.stockValue=Math.max(0,+(x.item.stockValue-consumed).toFixed(4));if(x.item.qty===0)x.item.stockValue=0;db.pantryMovements.push({at:Date.now(),kind:'Consumo na produção',id:x.item.id,name:x.item.name,unit:x.item.unit,qty:-x.qty,total:-consumed})});p.stock+=r.yieldQty*batches;db.production.push({at:Date.now(),product:p.id,batches,units:r.yieldQty*batches,cost:recipeCost(r)*batches});save();render()}
function allocateLeftovers(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===+f.get('product')),qty=+f.get('qty'),reason=String(f.get('reason'));if(!p||qty<1||qty>p.stock)return notify('Quantidade indisponível.');let size=+(reason.match(/\d+/)?.[0]||0);if(size&&qty%size!==0)return notify('Para caixas, use múltiplos de '+size+' unidades.');if(!confirm('Destinar '+qty+' unidades para '+reason+'?'))return;p.stock-=qty;db.allocations.push({at:Date.now(),product:p.name,qty,reason});save();render()}
function adminSettings(){return `<div class="section"><h2>Configurações</h2></div><div class="panel"><form class="stack" onsubmit="saveSettings(event)"><label class="field">Nome da loja<input name="name" maxlength="50" required value="${esc(db.settings.name)}"></label><label class="field">WhatsApp da loja (com DDI 55)<input name="whatsapp" placeholder="5541999999999" value="${esc(db.settings.whatsapp)}"></label><label class="field">Chave Pix da loja<input name="pixKey" value="${esc(db.settings.pixKey||'')}" placeholder="Chave Pix para copiar"></label><label class="field">Nome do recebedor Pix<input name="pixName" value="${esc(db.settings.pixName||'')}" placeholder="Nome exibido ao cliente"></label><div class="note">A chave Pix é pública para o cliente. A confirmação de pagamento deve ser feita no banco; integração automática exige servidor e API de pagamentos.</div><div class="two"><label class="field">Taxa de entrega (R$)<input type="number" min="0" step="0.01" name="deliveryFee" value="${db.settings.deliveryFee}"></label><label class="field">Pedido mínimo (R$)*<input type="number" min="0" step="0.01" name="minimum" value="${db.settings.minimum}"></label></div><div class="field">Paletas harmônicas (cores da marca)<div class="swatches">${['#a84e6e','#6b579a','#247d74','#b66b43','#376e9b'].map(c=>`<button type="button" class="swatch" style="background:${c}" onclick="setTheme('${c}');render()" aria-label="Tema ${c}"></button>`).join('')}</div></div><label class="field">Cor principal personalizada<input type="color" name="color" value="${esc(db.settings.color)}"></label><button class="btn primary full">Salvar configurações</button></form><p class="muted tiny">* Pedido mínimo armazenado para futura integração; não aplicado nesta demonstração.</p></div><div class="panel stack"><h3>Dados de demonstração</h3><button class="btn" onclick="exportData()">⬇️ Exportar backup JSON</button><button class="btn danger" onclick="if(confirm('Apagar todos os dados locais e restaurar o exemplo?')){localStorage.removeItem(KEY);location.reload()}">Restaurar dados de exemplo</button></div><div class="note">Sem autenticação real. Qualquer pessoa com acesso ao código pode alterar os dados locais. Para produção, use API, autenticação e autorização de papéis no servidor.</div>`}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.settings.name=String(f.get('name')).trim();db.settings.pixKey=String(f.get('pixKey')||'').trim();db.settings.pixName=String(f.get('pixName')||'').trim();db.settings.whatsapp=String(f.get('whatsapp')).replace(/\D/g,'');db.settings.deliveryFee=Math.max(0,+f.get('deliveryFee'));db.settings.minimum=Math.max(0,+f.get('minimum'));setTheme(String(f.get('color')));save();render();notify('Configurações salvas neste dispositivo')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='doce-atelie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
