name: APK Android versionado

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'admin-sync.js'
      - 'version.js'
      - 'api-client.js'
      - 'loja-online.html'
      - 'gestao-conectada.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-main
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar arquivos web e versão crescente
        run: |
          mkdir -p dist
          cp index.html api-client.js loja-online.html gestao-conectada.html admin-sync.js dist/
          node <<'JS'
          const fs=require('fs');
          const code=1000+Number(process.env.GITHUB_RUN_NUMBER);
          const version='1.1.'+process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync('dist/version.js','window.DOCE_BUILD='+JSON.stringify({version,code})+';');
          fs.writeFileSync('build-version.json',JSON.stringify({version,code,commit:process.env.GITHUB_SHA}));
          JS
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Criar e sincronizar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          node <<'JS'
          const fs=require('fs');
          const {code,version}=JSON.parse(fs.readFileSync('build-version.json'));
          const file='android/app/build.gradle';
          let gradle=fs.readFileSync(file,'utf8');
          if(!/versionCode\s+\d+/.test(gradle)||!/versionName\s+"[^"]+"/.test(gradle))throw Error('Gradle version fields not found');
          gradle=gradle.replace(/versionCode\s+\d+/,'versionCode '+code).replace(/versionName\s+"[^"]+"/,'versionName "'+version+'"');
          fs.writeFileSync(file,gradle);
          JS
      - name: Compilar release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Preparar APK e ferramentas de assinatura
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/
          cp build-version.json apk-output/
          TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$TOOLS/lib/apksigner.jar" apk-output/
          cp android/app/build/outputs/apk/release/output-metadata.json apk-output/
      - name: Assinar com chave permanente quando configurada
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          python - <<'PY'
          import os,base64,pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'],'doce-atelie.p12').write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))
          PY
          java -jar apk-output/apksigner.jar sign --ks "$RUNNER_TEMP/doce-atelie.p12" --ks-type PKCS12 --ks-key-alias doce-atelie --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out apk-output/doce-atelie.apk apk-output/app-release-unsigned.apk
          java -jar apk-output/apksigner.jar verify --verbose --print-certs apk-output/doce-atelie.apk
          rm "$RUNNER_TEMP/doce-atelie.p12"
      - name: Informar assinatura local necessária
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == ''
        run: echo "::warning::Secrets de assinatura ausentes. Este artefato contém APK SEM ASSINATURA; assine com a chave permanente local antes de instalar."
      - name: Disponibilizar APK versionado
        uses: actions/upload-artifact@v4
        with:
          name: doce-atelie-1.1.${{ github.run_number }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
