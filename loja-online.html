<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doce Ateliê · Cardápio conectado</title><style>:root{font-family:system-ui,sans-serif;color:#372b33;background:#fff8f7}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:800px;margin-inline:auto}h1{font-size:1.55rem}h2{font-size:1.2rem}.panel{background:white;border:1px solid #f1dce4;border-radius:20px;padding:18px;margin:14px 0}.stack{display:grid;gap:12px}input,button{font:inherit;padding:13px;border:1px solid #dbc7d0;border-radius:12px;min-width:0;width:100%}button{cursor:pointer;background:#a84e6e;color:white;border:0;font-weight:650}button:disabled{opacity:.45}label{display:grid;gap:6px;font-weight:600}.muted{color:#756a70;font-size:.9rem}.product{display:grid;grid-template-columns:1fr 110px;gap:10px;border-bottom:1px solid #eee;padding:14px 0}.price{font-weight:700}.error{color:#a32136}.ok{color:#207658}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}code{overflow-wrap:anywhere}.hidden{display:none}</style></head><body><header><h1>Doce Ateliê <span class="muted">· Conectado</span></h1><p class="muted">Cardápio e pedidos enviados ao servidor da loja. Nenhum acesso administrativo é disponibilizado nesta tela.</p></header><section class="panel stack" id="setup"><label>Endereço HTTPS da API<input id="api" placeholder="https://seu-dominio.com" autocomplete="url"></label><label>Identificador da loja ou conteúdo do QR<input id="shop" placeholder="ID da loja ou doceatelie://loja/ID"></label><button id="connect">Abrir cardápio</button><div id="message" role="status"></div></section><section class="panel hidden" id="store"><div class="row"><div><h2 id="shopName"></h2><p class="muted" id="shopInfo"></p></div><button id="refresh" style="width:auto">Atualizar</button></div><div id="products"></div><p class="price" id="total"></p><button id="order">Enviar pedido ao servidor</button><div id="orderResult" role="status"></div></section><section class="panel hidden" id="tracking"><h2>Acompanhar pedido</h2><p id="orderId"></p><button id="check">Consultar status</button><pre id="status" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section><script type="module">
import {DoceAtelieAPI} from "./api-client.js";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const defaultUrl=params.get("api")||localStorage.getItem("doce-api-url")||"https://kodak-shareware-grass-painting.trycloudflare.com";
$("api").value=defaultUrl;$("shop").value=params.get("shop")||localStorage.getItem("doce-shop-id")||"";
let client=null,shopId="",products=[],quantities={},tracking=null;
const money=c=>(Number(c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function message(t,error=false){$("message").textContent=t;$("message").className=error?"error":"ok";}
function parseShop(value){let s=value.trim();if(s.startsWith("doceatelie://loja/"))return decodeURIComponent(s.split("/").pop());try{let u=new URL(s);return u.searchParams.get("shop")||u.searchParams.get("loja")||s}catch{return s}}
function productList(data){return Array.isArray(data)?data:(data.products||data.items||data.catalog||[])}
async function connect(){try{$("connect").disabled=true;message("Consultando loja...");let url=$("api").value.trim(),id=parseShop($("shop").value);if(!id)throw Error("Informe o identificador da loja.");let c=new DoceAtelieAPI(url),data=await c.catalog(id);let store=data.shop||data.store||data;let list=productList(data);if(!Array.isArray(list))throw Error("Formato do catálogo não reconhecido.");client=c;shopId=id;products=list;quantities={};$("shopName").textContent=store.name||data.name||"Cardápio da loja";$("shopInfo").textContent="Produtos consultados no servidor";$("store").classList.remove("hidden");$("orderResult").textContent="";localStorage.setItem("doce-api-url",url);localStorage.setItem("doce-shop-id",id);render();message("Cardápio atualizado.");}catch(e){$("store").classList.add("hidden");message(e.message,true)}finally{$("connect").disabled=false}}
function render(){let host=$("products");host.replaceChildren();for(let p of products){let id=String(p.id),name=String(p.name||"Produto"),price=Number(p.price_cents||0),min=Math.max(1,Number(p.min_qty||1)),step=Math.max(1,Number(p.increment||1)),stock=Math.max(0,Number(p.stock||0));let row=document.createElement("div");row.className="product";let info=document.createElement("div");let strong=document.createElement("strong");strong.textContent=name;let detail=document.createElement("p");detail.className="muted";detail.textContent=money(price)+" · "+(stock?"Estoque: "+stock:"Indisponível")+" · Mínimo: "+min;info.append(strong,detail);let input=document.createElement("input");input.type="number";input.min="0";input.max=String(stock);input.step=String(step);input.value=String(quantities[id]||0);input.disabled=!stock;input.setAttribute("aria-label","Quantidade de "+name);input.addEventListener("change",()=>{let q=Number(input.value);if(!Number.isInteger(q)||q<0||q>stock||(q!==0&&(q<min||(q-min)%step!==0))){input.value=String(quantities[id]||0);return}quantities[id]=q;updateTotal()});row.append(info,input);host.append(row)}updateTotal()}
function updateTotal(){let total=products.reduce((s,p)=>s+Number(p.price_cents||0)*Number(quantities[String(p.id)]||0),0);$("total").textContent="Total: "+money(total)}
async function order(){let items=Object.entries(quantities).filter(([,qty])=>qty>0).map(([product_id,qty])=>({product_id,qty}));if(!items.length){$("orderResult").textContent="Selecione ao menos um produto.";return}try{$("order").disabled=true;let result=await client.placeOrder(shopId,items);let orderId=result.order_id||result.id,token=result.token||result.tracking_token||result.access_token;if(!orderId||!token)throw Error("Pedido enviado, mas o servidor não retornou os dados necessários para acompanhamento. Verifique o pedido na administração antes de reenviar.");tracking={shopId,orderId,token};sessionStorage.setItem("doce-tracking",JSON.stringify(tracking));$("tracking").classList.remove("hidden");$("orderId").textContent="Pedido: "+orderId;$("orderResult").textContent="Pedido registrado no servidor.";quantities={};render();}catch(e){$("orderResult").textContent=e.message}finally{$("order").disabled=false}}
async function check(){if(!tracking)return;try{let r=await client.orderStatus(tracking.shopId,tracking.orderId,tracking.token);$("status").textContent=JSON.stringify(r,null,2)}catch(e){$("status").textContent=e.message}}
$("connect").addEventListener("click",connect);$("refresh").addEventListener("click",connect);$("order").addEventListener("click",order);$("check").addEventListener("click",check);if($("shop").value)connect();
</script></body></html>
